<section id="sceeri-chart-workbench" aria-labelledby="sceeri-chart-title">
  <style>
    #sceeri-chart-workbench { color-scheme:dark; background:#111827; color:#f3f5fa; border:1px solid #303954; border-radius:14px; padding:1rem; font:400 .9rem/1.5 system-ui,sans-serif; }
    #sceeri-chart-workbench * { box-sizing:border-box; min-width:0; }
    #sceeri-chart-workbench h2 { margin:0 0 .8rem; font-size:1.15rem; }
    #sceeri-chart-workbench .chart-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.6rem; }
    #sceeri-chart-workbench label { display:grid; align-content:start; gap:.3rem; }
    #sceeri-chart-workbench .chart-wide { grid-column:1 / -1; }
    #sceeri-chart-workbench input, #sceeri-chart-workbench select, #sceeri-chart-workbench textarea, #sceeri-chart-workbench button {
      min-height:44px; padding:.45rem .65rem; border:1px solid #5d6b89; border-radius:8px; background:#101829; color:inherit; font:inherit;
    }
    #sceeri-chart-workbench textarea { min-height:5.7rem; resize:vertical; }
    #sceeri-chart-workbench :is(input,select,textarea,button,summary):focus-visible { outline:2px solid #00f5ff; outline-offset:2px; }
    #sceeri-chart-workbench [data-chart-run] { margin-top:.65rem; border-color:#00f5ff; color:#00f5ff; }
    #sceeri-chart-workbench .chart-note { color:#cbd5e1; margin:.55rem 0; overflow-wrap:anywhere; }
    #sceeri-chart-workbench svg { display:block; width:100%; color:#f3f5fa; }
    #sceeri-chart-workbench .chart-bar { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto; align-items:center; gap:.5rem; margin:.5rem 0; overflow-wrap:anywhere; }
    #sceeri-chart-workbench .chart-track { position:relative; height:.78rem; background:#273652; border-radius:3px; }
    #sceeri-chart-workbench .chart-track > span { position:absolute; height:100%; background:#00cbd7; border-radius:3px; }
    #sceeri-chart-workbench .chart-track > i { position:absolute; height:100%; border-left:1px solid #aab8d2; }
    #sceeri-chart-workbench table { width:100%; table-layout:fixed; border-collapse:collapse; }
    #sceeri-chart-workbench th, #sceeri-chart-workbench td { padding:.35rem; border-bottom:1px solid #465472; text-align:left; overflow-wrap:anywhere; }
    #sceeri-chart-workbench details { margin-top:.7rem; }
    #sceeri-chart-workbench summary { min-height:44px; padding:.5rem 0; }
    @media(max-width:450px) { #sceeri-chart-workbench .chart-fields { grid-template-columns:minmax(0,1fr); } }
  </style>
  <h2 id="sceeri-chart-title">Intelligent Charts</h2>
  <form data-chart-form>
    <div class="chart-fields">
      <label>Was sollen die Daten zeigen?
        <select data-chart-intent>
          <option value="compare">Vergleich nach Kategorie</option>
          <option value="trend">Verlauf in Eingabereihenfolge</option>
          <option value="relationship">Zusammenhang zwischen zwei Zahlen</option>
          <option value="composition">Anteile einer gemeinsamen Summe</option>
        </select>
      </label>
      <label>Quelle oder Messung<input data-chart-source maxlength="240" autocomplete="off"></label>
      <label data-chart-x-label hidden>X-Achse und Einheit<input data-chart-x maxlength="72" value="X"></label>
      <label>Messgröße und Einheit<input data-chart-unit maxlength="72" value="Wert"></label>
      <label class="chart-wide"><span data-chart-instructions>Daten pro Zeile als Bezeichnung;Wert</span><textarea data-chart-rows maxlength="6400" spellcheck="false"></textarea></label>
    </div>
    <button class="cursor-interaction" type="submit" data-chart-run>Chart prüfen und anzeigen</button>
  </form>
  <p class="chart-note" data-chart-status role="status">Messwerte oder Kategorien eingeben.</p>
  <div data-chart-output></div>
  <script>
    (() => {
      const root = document.getElementById('sceeri-chart-workbench');
      const field = (name) => root.querySelector('[data-chart-' + name + ']');
      const output = field('output');
      const labels = { compare:'Balkendiagramm', trend:'Liniendiagramm', relationship:'Streudiagramm', composition:'Anteilsbalken' };
      const numberFormat = new Intl.NumberFormat('de-DE', { maximumSignificantDigits: 6 });
      const format = (value) => numberFormat.format(value);
      const parser = /^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)(?:[eE][+-]?\d+)?$/;
      const svgNS = 'http://www.w3.org/2000/svg';
      const emit = (state, reason) => root.dispatchEvent(new CustomEvent('scevi:chart', { bubbles:true, detail:{ state, reason } }));

      function numeric(value, line) {
        if (!value || value.toLowerCase() === 'offen') return null;
        const parsed = Number(value.replace(',', '.'));
        if (!parser.test(value) || !Number.isFinite(parsed) || Math.abs(parsed) > 1e100 || (Math.abs(parsed) < 1e-100 && /[1-9]/.test(value.split(/[eE]/)[0]))) {
          throw new Error('Zeile ' + line + ' enthält keinen darstellbaren Zahlenwert.');
        }
        return parsed;
      }

      function parseRows(input, intent) {
        const rows = [];
        input.split(/\r?\n/).forEach((raw, index) => {
          if (!raw.trim()) return;
          const parts = raw.split(';').map((value) => value.trim());
          if (parts.length !== 2 || !parts[0]) throw new Error('Zeile ' + (index + 1) + ' braucht zwei Felder mit Semikolon.');
          const x = intent === 'relationship' ? numeric(parts[0], index + 1) : parts[0];
          const y = numeric(parts[1], index + 1);
          rows.push({ x, y, rawY:parts[1] });
        });
        if (!rows.length) throw new Error('Es fehlen Datenzeilen.');
        if (rows.length > 40) throw new Error('Für diese Ansicht sind bis zu 40 Zeilen möglich.');
        return rows;
      }

      function chartIssue(rows, intent, observed) {
        if (!observed.length) return 'Messwerte fehlen.';
        if (intent !== 'relationship' && new Set(rows.map((row) => row.x)).size !== rows.length) return 'Beschriftungen sind mehrdeutig. Präzisiere die wiederholten Bezeichnungen.';
        if (intent === 'trend' && observed.length < 2) return 'Ein Verlauf braucht mindestens zwei Werte.';
        if (intent === 'relationship' && (observed.length < 2 || new Set(observed.map((row) => row.x)).size < 2)) return 'Ein Zusammenhang braucht mindestens zwei vollständige Paare mit verschiedenen X-Werten.';
        if (intent === 'composition') {
          if (rows.length !== observed.length) return 'Die gemeinsame Summe ist wegen fehlender Werte offen.';
          if (rows.some((row) => row.y < 0) || !rows.some((row) => row.y > 0)) return 'Anteile brauchen nichtnegative Werte und eine positive Summe.';
        }
        return '';
      }

      function item(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      function dataTable(rows, xLabel, unit, opened) {
        const details = item('details');
        details.open = opened;
        const table = item('table');
        const header = table.createTHead().insertRow();
        for (const label of [xLabel, unit]) {
          const cell = item('th', label);
          cell.scope = 'col';
          header.append(cell);
        }
        const body = table.createTBody();
        for (const { x, y, rawY } of rows) {
          const row = body.insertRow();
          row.insertCell().textContent = x === null ? 'offen' : String(x);
          row.insertCell().textContent = y === null ? 'offen' : rawY;
        }
        details.append(item('summary', 'Wertetabelle'), table);
        return details;
      }

      function bars(rows, composition) {
        const group = item('div');
        const values = rows.filter((row) => row.y !== null).map((row) => row.y);
        const sum = composition ? values.reduce((total, value) => total + value, 0) : 0;
        const low = Math.min(0, ...values);
        const high = composition ? sum : Math.max(0, ...values);
        const range = high - low || 1;
        const zero = -low / range;
        for (const { x, y, rawY } of rows) {
          const row = item('div', undefined, 'chart-bar');
          const track = item('div', undefined, 'chart-track');
          track.setAttribute('aria-hidden', 'true');
          if (y !== null) {
            const mark = item('span');
            mark.style.insetInlineStart = (Math.min(y, 0) - low) / range * 100 + '%';
            mark.style.width = Math.abs(y) / range * 100 + '%';
            track.append(mark);
          }
          if (low < 0) {
            const baseline = item('i');
            baseline.style.insetInlineStart = zero * 100 + '%';
            track.append(baseline);
          }
          const text = y === null ? 'offen' : composition ? format(y / sum * 100) + ' %' : rawY;
          row.append(item('span', x), track, item('span', text));
          group.append(row);
        }
        if (composition) group.append(item('p', 'Gemeinsame Summe · ' + format(sum), 'chart-note'));
        return group;
      }

      function svgNode(tag, attrs, text) {
        const node = document.createElementNS(svgNS, tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function extent(values) {
        const low = Math.min(...values);
        const high = Math.max(...values);
        const margin = (high - low || Math.abs(low) || 1) * .08;
        return [low - margin, high + margin];
      }

      function points(rows, observed, asScatter, xLabel, unit) {
        const plot = svgNode('svg', { viewBox:'0 0 480 238', role:'img', 'aria-label':(asScatter ? 'Streudiagramm' : 'Liniendiagramm') + ' · Werte in der Tabelle' });
        const [y0, y1] = extent(observed.map((row) => row.y));
        const [x0, x1] = asScatter ? extent(observed.map((row) => row.x)) : [0, rows.length - 1];
        const xScale = (x) => 74 + (x - x0) / (x1 - x0) * 386;
        const yScale = (y) => 196 - (y - y0) / (y1 - y0) * 174;
        plot.append(svgNode('path', { d:'M74 22V196H460', fill:'none', stroke:'#8190ab' }));
        for (const y of [y0, y0 + (y1 - y0) / 2, y1]) {
          const coord = yScale(y);
          plot.append(svgNode('path', { d:'M74 ' + coord + 'H460', stroke:'#455571', fill:'none' }));
          plot.append(svgNode('text', { x:68, y:coord + 4, 'text-anchor':'end', fill:'currentColor', 'font-size':13 }, format(y)));
        }
        if (asScatter) {
          for (const x of [x0, x0 + (x1 - x0) / 2, x1]) {
            plot.append(svgNode('text', { x:xScale(x), y:214, 'text-anchor':'middle', fill:'currentColor', 'font-size':13 }, format(x)));
          }
        }
        plot.append(svgNode('text', { x:267, y:233, 'text-anchor':'middle', fill:'currentColor', 'font-size':13 }, asScatter ? xLabel.slice(0, 38) : 'Eingabereihenfolge'));
        const dataPoints = [];
        let path = '';
        let previousPresent = false;
        rows.forEach((row, index) => {
          if (row.x === null || row.y === null) {
            previousPresent = false;
            return;
          }
          const x = xScale(asScatter ? row.x : index);
          const y = yScale(row.y);
          if (!asScatter) path += (previousPresent ? 'L' : 'M') + x + ' ' + y;
          const mark = svgNode('circle', { cx:x, cy:y, r:4, fill:asScatter ? '#79aaff' : '#00f5ff' });
          mark.append(svgNode('title', {}, row.x + ' · ' + row.rawY + ' · ' + unit));
          dataPoints.push(mark);
          previousPresent = true;
        });
        if (path) plot.append(svgNode('path', { d:path, fill:'none', stroke:'#00cbd7', 'stroke-width':2 }));
        plot.append(...dataPoints);
        return plot;
      }

      field('intent').addEventListener('change', () => {
        const asScatter = field('intent').value === 'relationship';
        field('x-label').hidden = !asScatter;
        field('instructions').textContent = asScatter ? 'Daten pro Zeile als X-Wert;Y-Wert' : 'Daten pro Zeile als Bezeichnung;Wert';
      });
      field('form').addEventListener('input', () => {
        output.replaceChildren();
        field('status').textContent = 'Eingabe geändert. Chart erneut prüfen.';
        emit('OFFEN', 'Geänderte Eingaben prüfen');
      });

      root.addEventListener('scevi:chart-seed', (event) => {
        const initial = event.detail;
        field('intent').value = initial.intent;
        field('intent').dispatchEvent(new Event('change'));
        field('rows').value = initial.rows;
        field('source').value = initial.source || '';
        field('x').value = initial.x_label || 'X';
        field('unit').value = initial.unit || 'Wert';
        field('form').dispatchEvent(new Event('submit', { cancelable:true }));
      });

      field('form').addEventListener('submit', (event) => {
        event.preventDefault();
        output.replaceChildren();
        const intent = field('intent').value;
        const source = field('source').value.trim();
        const unit = field('unit').value.trim() || 'Wert';
        const xLabel = intent === 'relationship' ? field('x').value.trim() || 'X' : 'Bezeichnung';
        try {
          const rows = parseRows(field('rows').value, intent);
          const observed = rows.filter((row) => row.x !== null && row.y !== null);
          const issue = chartIssue(rows, intent, observed);
          if (!issue) {
            const visual = intent === 'compare' || intent === 'composition'
              ? bars(rows, intent === 'composition') : points(rows, observed, intent === 'relationship', xLabel, unit);
            output.append(visual);
          }
          output.append(dataTable(rows, xLabel, unit, Boolean(issue)));
          const origin = source ? 'Nutzerangabe · Quelle genannt: ' + source : 'Nutzerangabe · Quelle offen';
          const missing = rows.length - observed.length;
          field('status').textContent = (issue || labels[intent] + ' · ' + unit) + ' · ' + origin + (missing ? ' · ' + missing + ' Zeilen offen' : '');
          emit(issue || missing || !source ? 'OFFEN' : 'ABGELEITET', issue || (missing ? 'Fehlende Werte abgleichen' : source ? 'Messquelle und Messbedingungen abgleichen' : 'Messquelle ergänzen'));
        } catch (error) {
          field('status').textContent = error.message + ' Eingaben bleiben erhalten.';
          emit('OFFEN', error.message);
        }
      });
    })();
  </script>
</section>
