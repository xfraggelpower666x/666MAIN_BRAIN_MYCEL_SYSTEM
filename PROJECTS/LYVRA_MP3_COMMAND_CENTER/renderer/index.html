<!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>LYVRA MP3 COMMAND CENTER</title><link rel="stylesheet" href="style.css"></head><body><header><h1>L.Y.V.R.A. MP3</h1><span>666SOUNDsDESIGn // AUDIO COMMAND CENTER R02.1</span></header><main><nav><button data-tab="mp3">MP3 MANAGER</button><button data-tab="dj">AUTO DJ STUDIO</button><button data-tab="restore">RESTORATION LAB</button></nav><article><h2 id="title">MP3 MANAGER</h2><div class="toolbar"><button id="choose">Audio wählen</button><button id="folder">Ausgabeordner</button><button id="stop">MP3 STOP</button></div><p id="out">Kein Ausgabeordner</p><select id="files" size="8" multiple aria-label="Audiobibliothek"></select><label>Ausgabename <input id="name" value="output.wav"></label><section id="mp3"><button data-action="inspect">Inspect</button><label>Stream-Index <input id="stream" type="number" value="0" min="0"></label><button data-action="convert">Konvertieren</button><p>Nur markierte ID3-Felder ändern; markiert und leer löscht den Tag.</p><label><input type="checkbox" data-id3="TIT2" data-value-id="track"> Titel <input id="track" maxlength="2048"></label><label><input type="checkbox" data-id3="TPE1" data-value-id="artist"> Artist <input id="artist" maxlength="2048"></label><label><input type="checkbox" data-id3="TPE2" data-value-id="albumartist"> Albuminterpret <input id="albumartist" maxlength="2048"></label><label><input type="checkbox" data-id3="TALB" data-value-id="album"> Album <input id="album" maxlength="2048"></label><label><input type="checkbox" data-id3="TCON" data-value-id="genre"> Genre <input id="genre" maxlength="2048"></label><label><input type="checkbox" data-id3="TCOM" data-value-id="composer"> Komponist <input id="composer" maxlength="2048"></label><label><input type="checkbox" data-id3="TDRC" data-value-id="date"> Datum/Jahr <input id="date" maxlength="2048"></label
