[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-led-remapper-windows"
version = "1.12.0"
description = "Safe-by-default modular Windows keyboard lock LED activity monitor"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=7"]
tray = ["pystray>=0.19,<1", "Pillow>=9,<13"]

[project.scripts]
klrw = "klrw.cli:main"
klrw-gui = "klrw.gui:main"
klrw-ledctl = "klrw.ledctl:main"
klrw-locks = "klrw.lockindicator_cli:main"
klrw-rgb = "klrw.rgb_cli:main"
klrw-animations = "klrw.animations_cli:main"
klrw-sources = "klrw.sources_cli:main"
klrw-activity = "klrw.activity_window:main"
klrw-overview = "klrw.dashboard_cli:main"
klrw-dashboard = "klrw.dashboard_window:main"
klrw-capacity = "klrw.capacity_cli:main"
klrw-capacity-window = "klrw.capacity_window:main"
klrw-tray = "klrw.tray_window:main"
klrw-unified = "klrw.unified_tray:main"
klrw-drive-leds = "klrw.drive_led_window:main"
klrw-drive-workspace = "klrw.drive_workspace_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
