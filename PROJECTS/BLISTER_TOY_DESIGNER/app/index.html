'use strict';
const $=id=>document.getElementById(id);
const reference=JSON.parse($('reference').textContent),props=JSON.parse($('properties').textContent),i18n=JSON.parse($('language-data').textContent);
const names=Object.keys(props.properties),groups=['Branding','Verpackung','Figur','Accessoires'];
const base=structuredClone(props.properties),baseEn=i18n.default_values.en;
let language='en',group='Branding',mode='live',dirty=false;
const tr=k=>i18n.ui[language][k];
function template(){return mode==='original'?reference.template:i18n.prompt_templates[language]}
function prompt(){return replaceVariables(template())}
function applyLanguage(l){if(!i18n.supported_languages.includes(l))return;language=l;document.documentElement.lang=l;$('language').value=l;render()}
function replaceVariables(t){return t.replace(/<([^<>]+)>/g,(match,key)=>Object.hasOwn(props.properties,key)?(props.properties[key].value.trim()||match):match)}
function missingFields(){return names.filter(n=>!props.properties[n].value.trim())}
function showCompleteness(){const missing=missingFields();$('completeness').textContent=missing.length?tr('missing')+': '+missing.map(n=>i18n.field_labels[language][n]).join(' · '):tr('all_complete')}
function render(){
 $('subtitle').textContent=tr('subtitle');$('propertiesTitle').textContent=tr('properties');$('referenceTitle').textContent=tr('reference');$('presetLabel').textContent=tr('preset')+' ';$('customPreset').textContent=tr('custom');$('reset').textContent=tr('reset');$('export').textContent=tr('export');$('importButton').textContent=tr('import');$('live').textContent=tr('live');$('original').textContent=tr('original');$('copy').textContent=tr('copy');$('download').textContent=tr('download');$('protected').textContent=tr('protected');$('transparency').textContent=tr('transparency');$('tip').textContent=tr('tip');$('footer').textContent=tr('footer');$('templateNote').textContent=mode==='original'?tr('reference_language_note'):tr('template_note');$('languageLabel').textContent=tr('language');$('searchLabel').textContent=tr('search');$('fieldSearch').placeholder=tr('search_placeholder');$('check').textContent=tr('check');$('nextMissing').textContent=tr('next_missing');$('noMatches').textContent=tr('no_matches');
 $('tabs').replaceChildren(...groups.map(g=>{const b=document.createElement('button');b.type='button';b.textContent=i18n.groups[language][g];b.className=group===g?'active':'';b.setAttribute('aria-pressed',String(group===g));b.onclick=()=>{group=g;render()};return b}));
 $('fields').replaceChildren(...names.filter(n=>props.properties[n].group===group && (i18n.field_labels[language][n]+' '+n).toLocaleLowerCase().includes($('fieldSearch').value.toLocaleLowerCase())).map(n=>{const f=props.properties[n],d=document.createElement('div'),l=document.createElement('label'),input=document.createElement((n.includes('Foto')||n==='Kleidung'||n==='Pose')?'textarea':'input');d.className='field';l.textContent=i18n.field_labels[language][n]+'  <'+n+'>';l.htmlFor='field-'+names.indexOf(n);input.id=l.htmlFor;input.value=f.value;input.placeholder=tr('placeholder');input.oninput=()=>{f.value=input.value;dirty=true;update()};const count=document.createElement('small');count.textContent=f.value.length+' '+tr('field_counter');input.oninput=()=>{f.value=input.value;dirty=true;count.textContent=f.value.length+' '+tr('field_counter');update()};d.append(l,input,count);return d}));$('noMatches').hidden=$('fields').children.length>0;update();
}
function update(){const set=names.filter(n=>props.properties[n].value.trim()).length;$('count').textContent=`${set} / ${names.length} ${tr('filled')}`;$('preview').textContent=mode==='original'?reference.template:prompt();$('live').className=mode==='live'?'active':'';$('original').className=mode==='original'?'active':'';$('templateNote').textContent=mode==='original'?tr('reference_language_note'):tr('template_note');showCompleteness()}
function say(t){$('status').textContent=t}
function save(file,txt,type){const blob=new Blob([txt],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('language').onchange=e=>applyLanguage(e.target.value);$('fieldSearch').oninput=()=>render();$('check').onclick=()=>{showCompleteness();say(missingFields().length?tr('missing')+': '+missingFields().length:tr('all_complete'))};$('nextMissing').onclick=()=>{const n=missingFields()[0];if(!n){say(tr('missing_none'));return}group=props.properties[n].group;$('fieldSearch').value='';render();const target=$('field-'+names.indexOf(n));if(target){target.focus();target.scrollIntoView({block:'center',behavior:'auto'})}};
$('live').onclick=()=>{mode='live';update()};$('original').onclick=()=>{mode='original';update()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(mode==='original'?reference.template:prompt());say(tr('copy_ok'))}catch{say(tr('copy_fail'))}};
$('download').onclick=()=>save('blister_prompt_'+language+'.txt',mode==='original'?reference.template:prompt(),'text/plain;charset=utf-8');
$('export').onclick=()=>save('properties_card_custom.json',JSON.stringify({...props,interface_language:language},null,2),'application/json');
$('reset').onclick=()=>{for(const n of names)props.properties[n].value=i18n.default_values[language][n];group='Branding';$('fieldSearch').value='';$('preset').value='';dirty=false;render();say(tr('reset_ok'))};
$('importButton').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1024*1024)throw Error('JSON exceeds 1 MiB');const data=JSON.parse(await file.text());if(data.schema!==props.schema||data.reference_id!==reference.id||!data.properties||names.some(n=>typeof data.properties[n]?.value!=='string'||data.properties[n].value.length>10000))throw Error('Invalid schema / Ungültiges Schema');for(const n of names)props.properties[n].value=data.properties[n].value;dirty=true;if(i18n.supported_languages.includes(data.interface_language))language=data.interface_language;render();$('language').value=language;say(tr('import_ok'))}catch(err){say(tr('import_fail')+err.message)}e.target.value=''};
for(const key of Object.keys(props.presets)){const opt=document.createElement('option');opt.value=key;opt.textContent=key;$('preset').append(opt)}
$('preset').onchange=e=>{const preset=props.presets[e.target.value];if(!preset)return;for(const [key,value] of Object.entries(preset))if(props.properties[key])props.properties[key].value=value;dirty=true;render();say(tr('preset_ok'))};
// Start in English; translate the default property values without changing immutable source JSON.
for(const n of names)props.properties[n].value=baseEn[n];applyLanguage('en');
</script></body></html>
