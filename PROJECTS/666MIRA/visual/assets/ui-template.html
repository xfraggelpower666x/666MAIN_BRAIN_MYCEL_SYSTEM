<div id="sceeri-ui-navigation">
<style>
#sceeri-ui-navigation {
  --scevi-lilac:#c674ff; --scevi-cyan:#00f5ff; --scevi-pink:#ff72bd;
  --scevi-orange:#ffad58; --scevi-red:#ff6581; --scevi-green:#68ff6a; --scevi-blue:#79aaff;
}
#sceeri-ui-navigation > .view-switch {
  display:flex; flex-wrap:wrap; gap:.45rem; padding:.55rem .65rem; margin-bottom:.45rem;
  border:1px solid #303954; border-radius:12px; background:#080c19;
}
#sceeri-ui-navigation > .view-switch > button {
  min-height:44px; padding:.4rem .75rem; border:1px solid #53627c; border-radius:8px;
  background:#151e34; color:#f3f5fa; font:500 .88rem/1.4 system-ui,sans-serif;
}
#sceeri-ui-navigation > .view-switch > button[aria-pressed=true] {
  background:#302036; border-color:var(--scevi-pink); color:var(--scevi-pink);
}
#sceeri-ui-navigation > .view-switch > button:focus-visible { outline:2px solid #00f5ff; outline-offset:2px; }
#sceeri-ui-navigation > [hidden] { display:none !important; }
</style>

<nav class="view-switch" aria-label="Intelligent UI Modus">
  <button class="cursor-interaction" type="button" data-ui-mode="project" aria-pressed="true" aria-controls="sceeri-intelligent-ui">Projektansichten</button>
  <button class="cursor-interaction" type="button" data-ui-mode="formats" aria-pressed="false" aria-controls="sceeri-ui-formats">Visualformen</button>
  <button class="cursor-interaction" type="button" data-ui-mode="charts" aria-pressed="false" aria-controls="sceeri-ui-charts">Charts</button>

<section id="sceeri-intelligent-ui" aria-label="Interaktive Projektansicht">
<style>
#sceeri-intelligent-ui{--bg:#080c19;--surface:#111827;--text:#f3f5fa;--muted:#cbd5e1;--cyan:#00d8e6;--pink:#ff72bd;--action:var(--scevi-orange,#ffad58);color:var(--text);background:var(--bg);padding:1rem;border-radius:14px;font:400 14px/1.45 system-ui,sans-serif}
#sceeri-intelligent-ui *{box-sizing:border-box}
#sceeri-intelligent-ui h2,#sceeri-intelligent-ui h3,#sceeri-intelligent-ui p{margin-top:0}
#sceeri-intelligent-ui h2{font-size:1.25rem;font-weight:500}
#sceeri-intelligent-ui h3{font-size:1rem;font-weight:500}
#sceeri-intelligent-ui .muted{color:var(--muted)}
#sceeri-intelligent-ui .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem}
#sceeri-intelligent-ui .tag{background:#202c42;border-radius:100px;padding:.24rem .6rem}
#sceeri-intelligent-ui form{display:flex;align-items:end;gap:.5rem;margin:1rem 0}
#sceeri-intelligent-ui label{min-width:0;flex:1}
#sceeri-intelligent-ui label span{display:block;margin-bottom:.3rem}
#sceeri-intelligent-ui input{width:100%;background:var(--surface);border:1px solid #65748f;border-radius:8px;color:var(--text);min-height:44px;padding:.55rem .7rem;font:inherit}
#sceeri-intelligent-ui button{background:#202c42;border:1px solid #65748f;color:var(--text);border-radius:8px;min-height:44px;padding:.48rem .7rem;font:inherit;cursor:pointer}
#sceeri-intelligent-ui button:focus-visible,#sceeri-intelligent-ui input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#sceeri-intelligent-ui button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#190818}
#sceeri-intelligent-ui .primary{background:var(--cyan);border-color:var(--cyan);color:#071217;font-weight:500}
#sceeri-intelligent-ui .routing{border-left:3px solid var(--action);background:var(--surface);padding:.55rem .7rem;min-height:44px}
#sceeri-intelligent-ui nav{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
#sceeri-intelligent-ui .work{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(180px,.75fr);gap:1rem}
#sceeri-intelligent-ui .content{background:var(--surface);border-radius:10px;padding:1rem;min-height:210px}
#sceeri-intelligent-ui aside{border-left:1px solid #52627e;padding-left:.8rem}
#sceeri-intelligent-ui .source{color:var(--scevi-blue,#79aaff);overflow-wrap:anywhere}
#sceeri-intelligent-ui .item{border-left:3px solid var(--cyan);background:#1a263c;padding:.5rem .7rem;margin:.5rem 0}
#sceeri-intelligent-ui .item p{margin:0}
#sceeri-intelligent-ui .visual{width:100%;height:auto;display:block;margin:.8rem 0}
#sceeri-intelligent-ui .bars{display:flex;align-items:end;gap:.4rem;height:130px;margin:.8rem 0}
#sceeri-intelligent-ui .bar{flex:1;background:var(--pink);border-radius:3px 3px 0 0}
#sceeri-intelligent-ui .bar-labels{display:flex;gap:.4rem}
#sceeri-intelligent-ui .bar-labels span{flex:1;min-width:0;overflow-wrap:anywhere;text-align:center}
#sceeri-intelligent-ui [hidden]{display:none!important}
@media(max-width:650px){#sceeri-intelligent-ui .work{grid-template-columns:1fr}#sceeri-intelligent-ui aside{border-left:0;border-top:1px solid #52627e;padding:.8rem 0 0}}
@media(max-width:370px){#sceeri-intelligent-ui form{flex-wrap:wrap}#sceeri-intelligent-ui .primary{width:100%}}
</style>
<div class="top"><div><h2 data-title></h2><p class="muted" data-subtitle></p></div><span class="tag">SCEVI · Intelligent UI</span></div>
<form data-task><label><span>Was möchtest du untersuchen?</span><input data-intent type="text" autocomplete="off" placeholder="Aufgabe eingeben"></label><button class="primary" type="submit">Ansicht finden</button></form>
<div class="routing" data-decision aria-live="polite">Wähle eine Ansicht oder beschreibe deine Aufgabe.</div>
<nav data-nav aria-label="Ansichten"></nav>
<div class="work"><section class="content" data-content aria-live="polite"></section><aside data-evidence><h3>Belegmonitor</h3><div data-source class="source"></div><div data-gaps></div></aside></div>
<script type="application/json" data-ui-data>__SCEERI_UI_DATA__</script>
<script>
(function(){
const root=document.getElementById('sceeri-intelligent-ui');
const data=JSON.parse(root.querySelector('[data-ui-data]').textContent);
const nav=root.querySelector('[data-nav]'), content=root.querySelector('[data-content]'), decision=root.querySelector('[data-decision]');
root.querySelector('[data-title]').textContent=data.title;
root.querySelector('[data-subtitle]').textContent=data.subtitle||'';
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function svg(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(function(pair){n.setAttribute(pair[0],String(pair[1]))});return n}
function draw(view){
content.replaceChildren(el('h3','',view.title),el('p','muted',view.summary));
if(view.kind==='narrative'||view.kind==='cards'){
view.items.forEach(function(item){const box=el('div','item');box.append(el('strong','',item.label),el('p','',item.text));content.append(box)})}
if(view.kind==='line'){
const legend=el('div','',view.series.map(function(s){return s.label}).join(' · '));content.append(legend);
const graph=svg('svg',{viewBox:'0 0 600 160',class:'visual',role:'img','aria-label':'Qualitativer Verlauf: '+view.series.map(function(s){return s.label}).join(' und ')});
view.series.forEach(function(series,index){const points=series.values.map(function(v,i){return (10+i*580/(series.values.length-1))+','+(150-v*1.4)}).join(' ');graph.append(svg('polyline',{points:points,fill:'none',stroke:index===0?'#ffe082':'#00d8e6','stroke-width':'3'}))});
content.append(graph,el('p','muted',view.caption))}
if(view.kind==='bars'){
const bars=el('div','bars');bars.setAttribute('role','img');bars.setAttribute('aria-label','Qualitative Balkenfolge: '+view.bars.map(function(b){return b.label}).join(', '));
const labels=el('div','bar-labels');
view.bars.forEach(function(b){const n=el('div','bar');n.style.height=b.level+'%';bars.append(n);labels.append(el('span','',b.label))});
content.append(bars,labels,el('p','muted',view.caption))}
const source=root.querySelector('[data-source]');source.replaceChildren(el('p','muted','Quelle und Status'),el('p','',view.source+' · '+view.status));
const gaps=root.querySelector('[data-gaps]');gaps.replaceChildren(el('p','muted','Offene Angaben'));data.gaps.forEach(function(g){gaps.append(el('p','',g))});
Array.from(nav.children).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.view===view.id))})
root.dispatchEvent(new CustomEvent('scevi:view',{bubbles:true,detail:{id:view.id}}));
}
data.views.forEach(function(view){const b=el('button','',view.title);b.type='button';b.dataset.view=view.id;b.setAttribute('aria-pressed','false');b.addEventListener('click',function(){draw(view);decision.textContent='Manuell gewählt: '+view.title+'. Die Auswahl bleibt lokal.'});nav.append(b)});
root.querySelector('[data-task]').addEventListener('submit',function(event){
event.preventDefault();const q=root.querySelector('[data-intent]').value.toLocaleLowerCase('de-DE').trim();
const found=data.views.filter(function(v){return v.route_terms.some(function(term){return q.includes(term.toLocaleLowerCase('de-DE'))})});
if(found.length===1){draw(found[0]);decision.textContent='Zugeordnet zu '+found[0].title+': Suchbegriff aus deiner Eingabe erkannt. Lokale Auswahl, keine Projektaktion.'}
else if(found.length>1){decision.textContent='OFFEN: Mehrere passende Ansichten ('+found.map(function(v){return v.title}).join(', ')+'). Bitte auswählen.'}
else decision.textContent='OFFEN: Keine eindeutige Zuordnung. Bitte Ansicht auswählen oder Aufgabe präzisieren.'
});
root.addEventListener('scevi:restore-view', function(event){
  const view=data.views.find(candidate => candidate.id === event.detail.id);
  if(view)draw(view);
});
draw(data.views.find(view => view.id === data.companion?.start_view) || data.views[0]);
})();
</script>
</section>
