<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>GIF Studio</title>
<meta name="description" content="Change skin and hair colours in a GIF or a video, every frame at once, right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23be123c'/%3E%3Crect x='14' y='18' width='36' height='28' rx='4' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M28 26l10 6-10 6z' fill='%23fff'/%3E%3C/svg%3E">
<!--
  GIF Studio, part of Hyperreal Studio. One page, two homes: /hyperreal/gif on the SBS site and gif.html on
  GitHub Pages. Everything happens in the browser: nothing is uploaded and no AI is used, so it is instant and free.
    * reads GIFs (its own decoder), animated WebP/PNG (ImageDecoder) and videos (seeking a <video>)
    * colour changes: click a colour in the picture, choose the new one; matching is by colour (YCbCr) with a soft
      edge, the change keeps each pixel's shading, and an optional painted area limits where it may happen
    * exports GIFs with a worker per core (median-cut palette per frame, only the changed part of each frame is
      stored) or a video through MediaRecorder
-->
<style>
  :root {
    --bg: #f7f2f6; --panel: #ffffff; --panel2: #fbf6fa; --ink: #1d1220; --muted: #6b5a70; --line: #e7d6e3;
    --pink: #d6337f; --pink-ink: #ffffff; --soft: #fdeef5; --err-bg: #fdecec; --err: #9f1d1d; --stage: #ece2ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0914; --panel: #1a1020; --panel2: #160d1c; --ink: #f8eef6; --muted: #b9a5bf; --line: #34203b;
      --pink: #ff4fa8; --pink-ink: #050505; --soft: rgba(255,79,168,0.10); --err-bg: rgba(220,38,38,0.16); --err: #fecaca; --stage: #0a0610;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0914; --panel: #1a1020; --panel2: #160d1c; --ink: #f8eef6; --muted: #b9a5bf; --line: #34203b;
    --pink: #ff4fa8; --pink-ink: #050505; --soft: rgba(255,79,168,0.10); --err-bg: rgba(220,38,38,0.16); --err: #fecaca; --stage: #0a0610;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  a { color: var(--pink); }
  svg { width: 18px; height: 18px; flex: none; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  .top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top h1 { margin: 0; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; }
  .top .info { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); font-size: 13px; }
  .iconbtn:hover { border-color: var(--pink); }
  .iconbtn[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--pink-ink); }
  .iconbtn:disabled { opacity: 0.4; cursor: not-allowed; }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 372px; }
  .work { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: var(--stage); overflow: hidden; }
  .canvaswrap { position: relative; display: inline-block; line-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 6px 30px rgba(0,0,0,0.25); border-radius: 6px; overflow: hidden;
    background-color: #fff; background-image: linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%), linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  #view { display: block; }
  #ov { position: absolute; inset: 0; width: 100%; height: 100%; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: min(560px, 100%); min-height: 260px; padding: 20px; border: 2px dashed var(--pink); border-radius: 16px; text-align: center; color: var(--muted); cursor: pointer; background: var(--panel); }
  .drop strong { color: var(--ink); font-size: 18px; }
  .drop svg { width: 40px; height: 40px; color: var(--pink); }
  .stage.over .drop, .drop:hover { background: var(--soft); }
  .busy { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); color: #fff; font-size: 13px; z-index: 2; }
  .hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; font-size: 12px; padding: 5px 11px; border-radius: 999px; white-space: nowrap; pointer-events: none; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; z-index: 3; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

  .transport { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel2); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .transport input[type=range] { flex: 1; min-width: 120px; accent-color: var(--pink); }
  .transport .fr { font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .transport .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }

  .panel { background: var(--panel); overflow-y: auto; min-height: 0; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec h2 { margin: 0 0 4px; font-size: 15px; }
  .sec > p { margin: 0 0 10px; font-size: 12.5px; }
  .layer { border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; margin-bottom: 10px; background: var(--panel2); }
  .layer.active { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink) inset; }
  .layer.off { opacity: 0.6; }
  .lhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .lhead b { font-size: 14px; }
  .lhead .sp { flex: 1; }
  .lhead input { accent-color: var(--pink); width: 16px; height: 16px; }
  .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
  .x:hover { color: var(--pink); }
  .lrow { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .lab { width: 40px; flex: none; font-size: 12px; color: var(--muted); }
  .sws { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.25); cursor: pointer; padding: 0; flex: none; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--pink); outline-offset: 1px; }
  .sw.sample { width: 26px; height: 26px; border-radius: 50%; position: relative; }
  .sw.sample:hover::after { content: "\00d7"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 0 3px #000; font-size: 15px; }
  .lrow input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
  .presets { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 6px 46px; }
  .sl { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 3px 0; }
  .sl input { width: 100%; accent-color: var(--pink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 0 10px; height: 30px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--pink); color: var(--pink-ink); }
  .field { margin: 10px 0; }
  .field > label, .field > .flabel { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--pink); background: transparent; border-radius: 10px; padding: 8px 14px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
  .btn.main { background: var(--pink); color: var(--pink-ink); font-weight: 650; }
  .btn.wide { width: 100%; margin-top: 10px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .prog { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .prog i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .15s; }
  .result { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel2); }
  .result img, .result video { display: block; max-width: 100%; max-height: 260px; margin: 0 auto 8px; border-radius: 8px; }
  .warn { color: var(--err); background: var(--err-bg); border-radius: 8px; padding: 6px 9px; font-size: 12px; margin-top: 6px; }

  @media (max-width: 860px) {
    body { height: auto; min-height: 100%; }
    .app { grid-template-columns: minmax(0, 1fr); }
    .work { border-right: 0; border-bottom: 1px solid var(--line); }
    .stage { min-height: 320px; height: 56vh; flex: none; }
    .panel { overflow: visible; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>GIF Studio</h1>
  <a class="iconbtn" id="backLink" href="./" title="Back to Hyperreal Studio">Hyperreal</a>
  <span class="info" id="info"></span>
  <button class="iconbtn" id="themeBtn" type="button" title="Light or dark" aria-label="Switch light or dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>
  </button>
</header>

<main class="app">
  <section class="work" aria-label="Animation">
    <div class="stage" id="stage">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/gif,image/webp,image/png,image/apng,image/jpeg,video/*,.gif,.mp4,.webm,.mov,.m4v" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>
        <strong>Drop a GIF or a video</strong>
        <span>Or click to choose one, or paste with Ctrl+V. GIF, MP4, WebM, MOV or animated WebP.</span>
        <span class="small">It all happens on this device: nothing is uploaded, nothing costs anything.</span>
      </label>
      <div class="canvaswrap" id="wrap" hidden><canvas id="view"></canvas><canvas id="ov"></canvas></div>
      <div class="busy" id="busy" hidden><div class="spin"></div><span id="busyText">Reading…</span></div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <div class="transport" id="transport" hidden>
      <button class="iconbtn" id="playBtn" type="button" title="Play or pause (Space)" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="iconbtn" id="prevBtn" type="button" title="Previous frame (Left arrow)" aria-label="Previous frame">&lsaquo;</button>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Frame">
      <button class="iconbtn" id="nextBtn" type="button" title="Next frame (Right arrow)" aria-label="Next frame">&rsaquo;</button>
      <span class="fr" id="frameNo">1 / 1</span>
      <span class="sep"></span>
      <button class="iconbtn" id="beforeBtn" type="button" title="Hold to see the original (hold B)">Before</button>
      <button class="iconbtn" id="maskBtn" type="button" aria-pressed="false" title="Show what the colour changes touch (M)">Show changes</button>
      <button class="iconbtn" id="frameBtn" type="button" title="Save this frame as a PNG">PNG</button>
      <button class="iconbtn" id="newBtn" type="button" title="Open another GIF or video">New</button>
    </div>
  </section>

  <aside class="panel" aria-label="Controls">
    <section class="sec">
      <h2>Colour changes</h2>
      <p class="muted">Click <b>Pick</b>, click the skin or hair in the picture, then choose the new colour. Every frame changes, shading and all.</p>
      <div id="layers"></div>
      <button class="btn" id="addLayer" type="button">+ Another colour</button>
    </section>
    <section class="sec">
      <h2>Timing and size</h2>
      <div class="field"><label for="speed">Speed</label>
        <select id="speed"><option value="0.25">0.25× (slow motion)</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></div>
      <div class="field"><span class="flabel">Play</span>
        <div class="seg" id="orderSeg" role="group" aria-label="Play order"><button type="button" data-order="fwd" aria-pressed="true">Forward</button><button type="button" data-order="rev" aria-pressed="false">Reverse</button><button type="button" data-order="ping" aria-pressed="false">Back and forth</button></div></div>
      <div class="field"><span class="flabel">Trim</span>
        <div class="row"><button class="iconbtn" id="trimA" type="button" title="Start at the frame on screen">Start here</button><button class="iconbtn" id="trimB" type="button" title="End at the frame on screen">End here</button><button class="iconbtn" id="trimAll" type="button">All frames</button></div>
        <div class="muted small" id="trimText" style="margin-top:4px"></div></div>
      <div class="field"><label for="width">Width</label><select id="width"></select></div>
      <div class="field" id="vfpsField" hidden><label for="vfps">Frames a second (videos)</label>
        <div class="row"><select id="vfps" style="width:auto;flex:1"><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option><option value="25">25</option><option value="30">30</option></select><button class="iconbtn" id="reread" type="button">Read again</button></div>
        <div class="muted small" style="margin-top:4px">More frames are smoother and make bigger GIFs. A video is read up to 360 frames.</div></div>
    </section>
    <section class="sec">
      <h2>Export</h2>
      <div class="seg" id="fmtSeg" role="group" aria-label="Format"><button type="button" data-fmt="gif" aria-pressed="true">GIF</button><button type="button" data-fmt="video" aria-pressed="false">Video</button></div>
      <button class="btn main wide" id="exportBtn" type="button" disabled>Export GIF</button>
      <div class="prog" id="prog" hidden><i id="progBar"></i></div>
      <div class="muted small" id="progText" style="margin-top:4px"></div>
      <div class="result" id="result" hidden></div>
    </section>
  </aside>
</main>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
  };
  const qsTheme = new URLSearchParams(location.search).get('theme');
  function applyTheme(t) { t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'); }
  applyTheme(store.get('hr_theme') || (qsTheme === 'dark' || qsTheme === 'light' ? qsTheme : null));
  $('themeBtn').onclick = () => {
    const t = document.documentElement.getAttribute('data-theme');
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(dark ? 'light' : 'dark'); store.set('hr_theme', dark ? 'light' : 'dark');
  };
  const onSite = location.pathname.indexOf('/hyperreal/gif') === 0;
  $('backLink').href = (onSite ? '/hyperreal' : './') + (qsTheme ? '?theme=' + encodeURIComponent(qsTheme) : '');

  // ==== codec start (no DOM in here: the export workers run these, and tests/test_gif_studio.py runs them in node)
  // A colour change, on a region of a frame. L: prepared layers (prepLayers). Each layer's picked shades make a ramp
  // from dark to light; a pixel matches by how far its colour is from the ramp at its own brightness (brightness past
  // either end counts too). Each pixel goes to the one layer that matches it best, and moves by the offset from the
  // layer's first pick to the new colour, so its shading and texture stay. mask (optional) gets how much it moved.
  function kernel(src, W, rx, ry, rw, rh, dst, L, mask) {
    const n = L.length;
    for (let y = 0; y < rh; y++) {
      let si = ((ry + y) * W + rx) << 2, di = (y * rw) << 2, ai = (ry + y) * W + rx, mi = y * rw;
      for (let x = 0; x < rw; x++, si += 4, di += 4, ai++, mi++) {
        const r = src[si], g = src[si + 1], b = src[si + 2], a = src[si + 3];
        let R = r, G = g, B = b, bw = 0, bl = null;
        if (a && n) {
          const Y = 0.299 * r + 0.587 * g + 0.114 * b, Cb = -0.168736 * r - 0.331264 * g + 0.5 * b, Cr = 0.5 * r - 0.418688 * g - 0.081312 * b;
          for (let k = 0; k < n; k++) {
            const l = L[k];
            let w = l.area ? l.area[ai] / 255 : 1;
            if (w <= 0) continue;
            const ys = l.ry, m = l.m;
            let cb, cr, out;
            if (Y <= ys[0]) { cb = l.rcb[0]; cr = l.rcr[0]; out = ys[0] - Y; }
            else if (Y >= ys[m - 1]) { cb = l.rcb[m - 1]; cr = l.rcr[m - 1]; out = Y - ys[m - 1]; }
            else {
              let j = 1; while (ys[j] < Y) j++;
              const f = (Y - ys[j - 1]) / ((ys[j] - ys[j - 1]) || 1);
              cb = l.rcb[j - 1] + (l.rcb[j] - l.rcb[j - 1]) * f; cr = l.rcr[j - 1] + (l.rcr[j] - l.rcr[j - 1]) * f; out = 0;
            }
            const dy = out * l.lw, db = Cb - cb, dr = Cr - cr, d2 = dy * dy + db * db + dr * dr;
            if (d2 >= l.out2) continue;
            if (d2 > l.in2) { const t = (l.outR - Math.sqrt(d2)) / l.soft; w *= t * t * (3 - 2 * t); }
            w *= l.str;
            if (w > bw) { bw = w; bl = l; }
          }
          if (bl) {
            const nY = bl.tY + (Y - bl.refY) * bl.k, nCb = Cb + bl.tCb - bl.refCb, nCr = Cr + bl.tCr - bl.refCr;
            R += (nY + 1.402 * nCr - R) * bw;
            G += (nY - 0.344136 * nCb - 0.714136 * nCr - G) * bw;
            B += (nY + 1.772 * nCb - B) * bw;
          }
        }
        dst[di] = R; dst[di + 1] = G; dst[di + 2] = B; dst[di + 3] = a;
        if (mask) mask[mi] = bw * 255;
      }
    }
  }
  // the layers as the kernel wants them: the ramp of picked shades and the new colour in YCbCr, thresholds squared,
  // the area at the frame's size. A sample is [r, g, b] or [r, g, b, darkest, lightest] (the spread around a click).
  function prepLayers(layers, areaOf) {
    const ycc = c => [0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2], -0.168736 * c[0] - 0.331264 * c[1] + 0.5 * c[2], 0.5 * c[0] - 0.418688 * c[1] - 0.081312 * c[2]];
    const out = [];
    for (const l of layers) {
      if (!l.on || !l.samples.length) continue;
      const to = l.to ? [parseInt(l.to.slice(1, 3), 16), parseInt(l.to.slice(3, 5), 16), parseInt(l.to.slice(5, 7), 16)] : l.samples[0];
      const t = ycc(to), ref = ycc(l.samples[0]), pts = [];
      l.samples.forEach(c => {
        const q = ycc(c); pts.push(q);
        if (c.length >= 5) { if (c[3] < q[0] - 1) pts.push([c[3], q[1], q[2]]); if (c[4] > q[0] + 1) pts.push([c[4], q[1], q[2]]); }
      });
      pts.sort((p, q) => p[0] - q[0]);
      const tol = l.tol, soft = Math.max(0.5, l.soft);
      out.push({ m: pts.length, ry: Float32Array.from(pts, p => p[0]), rcb: Float32Array.from(pts, p => p[1]), rcr: Float32Array.from(pts, p => p[2]),
        lw: pts.length > 1 ? 0.8 : 0.45,                // past the picked shades, brightness counts for more
        refY: ref[0], refCb: ref[1], refCr: ref[2], k: Math.min(1.9, Math.max(0.55, Math.sqrt((t[0] + 20) / (ref[0] + 20)))),
        tY: t[0], tCb: t[1], tCr: t[2], in2: tol * tol, out2: (tol + soft) * (tol + soft), outR: tol + soft, soft,
        str: l.str / 100, area: areaOf ? areaOf(l) : null });
    }
    return out;
  }
  // a palette of at most 256 colours (255 and a transparent one when tr marks any pixel): every exact colour when
  // there are few enough (most GIFs), else median cut over a 5-6-5 histogram

    else if (e.key === 'p' || e.key === 'P') setTool(S.tool === 'pick' ? null : 'pick');
  });
  document.addEventListener('keyup', e => { if (e.key === 'b' || e.key === 'B') before(false); });
  stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('over'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('over'));
  stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) take(f); });
  document.addEventListener('paste', e => {
    const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => /^(image|video)\//.test(x.type));
    if (f) { e.preventDefault(); take(f); }
  });

  // ---------------------------------------------------------------- export
  function save(blob, name) {
    const a = el('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function progress(done, total, text) {
    $('prog').hidden = total == null; $('progBar').style.width = total ? Math.round(done / total * 100) + '%' : '0';
    $('progText').textContent = text || '';
  }
  let POOL = null, PENDING = new Map();
  function pool() {
    if (POOL) return POOL;
    const src = [kernel, quantize, lzwEncode, encodeJob].map(f => f.toString()).join('\n') +
      '\nlet L = [];\nonmessage = e => { const m = e.data; if (m.type === "init") { L = m.L; return; } ' +
      'try { const r = encodeJob(m, L); postMessage(r, [r.pal.buffer, r.lzw.buffer]); } catch (err) { postMessage({ k: m.k, error: String(err && err.message || err) }); } };';
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const n = Math.max(1, Math.min(8, (navigator.hardwareConcurrency || 4) - 1));
    const ws = [];
    for (let i = 0; i < n; i++) {
      const w = new Worker(url);
      w.onmessage = e => { const r = e.data, h = PENDING.get(r.k); if (!h) return; PENDING.delete(r.k); r.error ? h[1](new Error(r.error)) : h[0](r); };
      w.onerror = e => { e.preventDefault(); PENDING.forEach(h => h[1](new Error('A worker failed'))); PENDING.clear(); };
      ws.push(w);
    }
    POOL = ws;
    return ws;
  }
  // frames of the export at the chosen size, in play order, each with its delay in ms
  function* outFrames(W2, H2) {
    const order = seq();
    const same = W2 === S.W && H2 === S.H;
    const a = canvasOf(S.W, S.H), ax = a.getContext('2d'), img = ax.createImageData(S.W, S.H);
    const b = canvasOf(W2, H2), bx = b.getContext('2d', { willReadFrequently: true });
    bx.imageSmoothingQuality = 'high';
    for (let k = 0; k < order.length; k++) {
      const fi = order[k];
      let px;
      if (same) px = new Uint8ClampedArray(S.frames[fi]);
      else { img.data.set(S.frames[fi]); ax.putImageData(img, 0, 0); bx.clearRect(0, 0, W2, H2); bx.drawImage(a, 0, 0, W2, H2); px = bx.getImageData(0, 0, W2, H2).data; }
      yield { k, n: order.length, px, ms: S.delays[fi] / S.speed };
    }
  }
  async function exportGif() {
    const W2 = S.outW, H2 = Math.max(1, Math.round(S.H * W2 / S.W)), t0 = performance.now();
    const L = prepLayers(S.layers, l => areaAt(l, W2, H2));
    let ws = null;
    try { ws = pool(); ws.forEach(w => w.postMessage({ type: 'init', L })); } catch (e) { ws = null; }
    const run = (job, wi) => ws
      ? new Promise((ok, no) => { PENDING.set(job.k, [ok, no]); ws[wi % ws.length].postMessage(job, job.keep ? [job.px, job.keep.buffer] : [job.px]); })
      : new Promise(ok => setTimeout(() => ok(encodeJob(job, L)), 0));
    const frames = [], inflight = [], limit = (ws ? ws.length : 1) * 3;
    let prev = null, done = 0, sent = 0, total = 0;
    for (const f of outFrames(W2, H2)) {
      if (S.cancel) break;
      total = f.n;
      const cs = Math.max(2, Math.round(f.ms / 10));
      let rect = [0, 0, W2, H2], keep = null;
      if (prev && !S.alpha) {
        const d = diffFrame(f.px, prev, W2, H2);
        if (!d) { frames[frames.length - 1].cs += cs; done++; progress(done, total, 'Making the GIF… ' + done + ' of ' + total + ' frames'); continue; }   // the same again: just show the last one longer
        rect = d.rect; keep = d.keep;
      }
      prev = f.px;
      const slot = { cs, res: null }; frames.push(slot);
      const p = run({ k: f.k, px: f.px.slice().buffer, W: W2, H: H2, rect, keep }, sent++).then(r => { slot.res = r; done++; progress(done, total, 'Making the GIF… ' + done + ' of ' + total + ' frames'); });
      inflight.push(p);
      if (inflight.length >= limit) await inflight.shift();
    }
    await Promise.all(inflight);
    if (S.cancel) return null;
    const bytes = gifBytes(W2, H2, frames, S.alpha);
    return { blob: new Blob([bytes], { type: 'image/gif' }), W: W2, H: H2, frames: frames.length, secs: (performance.now() - t0) / 1000, ext: 'gif' };
  }
  // a video through MediaRecorder, in real time: MP4 where the browser records it (plays everywhere), else WebM.
  // Frames go in only once the recorder says it has started: fed sooner, the first recording on a page came out
  // empty (11-18). An empty recording still falls through to the next format.
  async function exportVideo() {
    const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
      .filter(t => { try { return !!window.MediaRecorder && MediaRecorder.isTypeSupported(t); } catch (e) { return false; } });
    if (!types.length) throw new Error("This browser can't make videos. Export a GIF instead.");
    S.vtries = [];
    for (const mime of types) {
      const r = await recordVideo(mime);
      S.vtries.push(mime + ': ' + (r ? r.blob.size : 'stopped'));
      if (!r || r.blob.size) return r;
    }
    throw new Error("This browser couldn't record a video. Export a GIF instead.");
  }
  async function recordVideo(mime) {
    let W2 = S.outW, H2 = Math.max(2, Math.round(S.H * W2 / S.W)); W2 -= W2 % 2; H2 -= H2 % 2;
    const c = canvasOf(W2, H2), x = c.getContext('2d'), stream = c.captureStream(0), track = stream.getVideoTracks()[0];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.round(Math.min(12e6, Math.max(2e6, W2 * H2 * 30 * 0.12))) });
    const chunks = [], stopped = new Promise(ok => { rec.onstop = ok; });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const L = prepLayers(S.layers, l => areaAt(l, W2, H2));
    const tmp = canvasOf(W2, H2), tx = tmp.getContext('2d'), img = tx.createImageData(W2, H2);
    x.fillStyle = '#000'; x.fillRect(0, 0, W2, H2);
    const started = new Promise(ok => { rec.onstart = ok; setTimeout(ok, 3000); });
    rec.start(250);
    await started;
    if (track.requestFrame) track.requestFrame();
    const t0 = performance.now();
    let due = 0, n = 0, total = 0;
    for (const f of outFrames(W2, H2)) {
      if (S.cancel) break;
      total = f.n;
      kernel(f.px, W2, 0, 0, W2, H2, img.data, L, null);
      tx.putImageData(img, 0, 0);
      x.fillRect(0, 0, W2, H2); x.drawImage(tmp, 0, 0);               // see-through parts on black
      if (track.requestFrame) track.requestFrame();
      due += f.ms; n++;
      progress(n, total, 'Recording the video (it plays through once)… ' + n + ' of ' + total);
      const wait = t0 + due - performance.now();
      if (wait > 0) await sleep(wait);
    }
    rec.stop(); await stopped;
    track.stop();
    if (S.cancel) return null;
    const type = mime.split(';')[0];
    return { blob: new Blob(chunks, { type }), W: W2, H: H2, frames: n, secs: (performance.now() - t0) / 1000, ext: type === 'video/mp4' ? 'mp4' : 'webm' };
  }
  $('exportBtn').onclick = async () => {
    if (S.exporting) { S.cancel = true; return; }
    if (!S.frames.length || S.busy) return;
    play(false); setTool(null);
    S.exporting = true; S.cancel = false;
    const btn = $('exportBtn'); btn.textContent = 'Stop';
    progress(0, 1, S.fmt === 'gif' ? 'Making the GIF…' : 'Getting the video ready…');
    $('result').hidden = true;
    try {
      const r = S.fmt === 'gif' ? await exportGif() : await exportVideo();
      if (r) showResult(r); else progress(null, null, 'Stopped.');
    } catch (e) {
      progress(null, null, ''); $('result').hidden = false; $('result').innerHTML = '';
      $('result').appendChild(el('div', 'warn', (e && e.message) || "Couldn't export that."));
    } finally {
      S.exporting = false; S.cancel = false; btn.textContent = S.fmt === 'gif' ? 'Export GIF' : 'Export video';
    }
  };
  function showResult(r) {
    if (S.result) URL.revokeObjectURL(S.result);
    const url = URL.createObjectURL(r.blob); S.result = url; S.out = r;
    const box = $('result'); box.innerHTML = ''; box.hidden = false;
    if (r.ext === 'gif') { const im = el('img'); im.src = url; im.alt = 'The exported GIF'; box.appendChild(im); }
    else { const v = el('video'); v.src = url; v.controls = true; v.loop = true; v.muted = true; v.autoplay = true; v.playsInline = true; box.appendChild(v); }
    box.appendChild(el('div', 'small muted', fmtSize(r.blob.size) + ' · ' + r.W + '×' + r.H + ' · ' + r.frames + (r.frames === 1 ? ' frame' : ' frames') + ' · made in ' + r.secs.toFixed(1) + ' s'));
    if (r.blob.size > 10 * 1048576) box.appendChild(el('div', 'warn', 'Over 10 MB: Discord takes it only with Nitro. A smaller width or fewer frames brings it down.'));
    const a = el('a', 'btn main wide', 'Download ' + (r.ext === 'gif' ? 'GIF' : r.ext.toUpperCase())); a.href = url; a.download = S.name + '-studio.' + r.ext;
    box.appendChild(a);
    progress(null, null, '');
  }

  renderLayers();
  window.__gs = { S, take, render, prepLayers, exportGif, pickAt, setTool, goTo };
})();
</script>
</body>
