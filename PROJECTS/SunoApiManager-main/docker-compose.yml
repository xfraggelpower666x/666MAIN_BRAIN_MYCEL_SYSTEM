# ─────────────────────────────────────────────────────────────
# Suno Manager — Docker Compose
# ─────────────────────────────────────────────────────────────

services:
  suno-manager:
    image: smgteknik/sunoapimanager:latest
    build: .
    container_name: suno-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./downloads:/app/downloads
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=Europe/Istanbul

  suno-mcp:
    build: .
    image: smgteknik/sunoapimanager:latest
    profiles: ["mcp"]
    command: ["python", "suno_mcp_server.py"]
    stdin_open: true
    tty: false
    restart: "no"
    environment:
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      SUNO_API_BASE_URL: ${SUNO_API_BASE_URL:-https://api.sunoapi.org}
    healthcheck:
      disable: true
