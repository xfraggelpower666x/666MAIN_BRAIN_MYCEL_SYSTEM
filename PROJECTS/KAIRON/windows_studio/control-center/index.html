<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>666 Development Control Center</title><style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;--pink:#ff4fca;--cyan:#38ebfa;--violet:#b76bff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070913;color:#eaf9ff}
body{background:radial-gradient(ellipse at 30% 0%,#45104f88,transparent 49%),radial-gradient(ellipse at 88% 40%,#0b587366,transparent 52%),#080911}
header{padding:4vh 5vw 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #4ceafa55}
h1{margin:0;color:var(--cyan);font-size:clamp(22px,3.2vw,46px);letter-spacing:.08em;text-shadow:0 0 18px #2eeefa8a}
header p{color:#f39bdb;letter-spacing:.2em;margin:8px 0 0}.version{color:var(--violet);letter-spacing:.12em}
main{padding:4vh 5vw;max-width:1450px;margin:auto}.lead{color:#c5bed9;font-size:1.08rem;margin:0 0 3vh}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
button{cursor:pointer;text-align:left;background:linear-gradient(115deg,#1c192eeb,#141b32e8);border:1px solid #36d9ee8a;border-radius:15px;padding:23px 28px;color:white;box-shadow:inset 0 0 18px #3cdbff16,0 0 15px #0007;transition:background .16s,transform .16s,border-color .16s}
button:nth-child(even){border-color:#db5dff99}button:hover,button:focus-visible{border-color:var(--pink);background:#292039;transform:translateY(-2px);outline:none}
button strong{display:block;font-size:1.07rem;color:#f6f6ff;letter-spacing:.05em}button small{display:block;margin-top:8px;color:#aaa8cf;font-size:.88rem}
footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-top:26px;color:#c5b3d7}
#status{color:var(--cyan)}#quit{border-color:var(--pink);padding:12px 24px;font-weight:bold}
@media(max-width:760px){.actions{grid-template-columns:1fr}header{display:block}.version{margin-top:8px}}
</style></head><body>
<header><div><h1>666 DEVELOPMENT CONTROL CENTER</h1><p>666SOUNDsDESIGn · FRAGGLEPOWER666</p></div><div class="version">ELECTRON · R01.11</div></header>
<main><p class="lead">Universelles Python / Electron Buildkit · Geschützte Build-Engine · Ausführbare Aktionen mit sichtbarem Protokoll</p>
<section class="actions" id="actions">
<button data-action="scan"><strong>01 · TOOLS SCANNEN</strong><small>Python · Node · npm · Git · Winget · C++</small></button>
<button data-action="install"><strong>02 · INSTALL / UPDATE</strong><small>Nur mit deiner ausdrücklichen Freigabe</small></button>
<button data-action="prepare"><strong>03 · PYTHON VORBEREITEN</strong><small>Virtuelle Umgebung und Projektpakete</small></button>
<button data-action="run-python"><strong>04 · PYTHON STARTEN</strong><small>Originalen Projekteinstieg ausführen</small></button>
<button data-action="test"><strong>05 · PROJEKT TESTEN</strong><small>Konfigurierte Regression ausführen</small></button>
<button data-action="run-electron"><strong>06 · ELECTRON VOLLBILD</strong><small>Python-Backend mit vorhandener Electron-App</small></button>
<button data-action="portable"><strong>07 · PORTABLE EXE BAUEN</strong><small>PyInstaller + electron-builder</small></button>
<button data-action="setup"><strong>08 · WINDOWS SETUP BAUEN</strong><small>NSIS mit Installationsverzeichniswahl</small></button>
<button data-action="setup-control"><strong>09 · ELECTRON RUNTIME PRÜFEN</strong><small>Gezielte Runtime-Reparatur mit Bestätigung</small></button>
</section>
<footer><span id="status" role="status">Bereit · Kein automatischer Download</span><button id="quit">BEENDEN</button></footer></main>
<script src="control.js"></script></body></html>
