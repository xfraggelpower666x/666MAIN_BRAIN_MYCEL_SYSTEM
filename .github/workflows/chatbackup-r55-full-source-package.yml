name: ChatBackup R5.5 single EXE complete Windows source package
on:
  push:
    branches:
      - feature/chatbackup-r55-source-relocation-20261121
    paths:
      - '.github/workflows/chatbackup-r55-full-source-package.yml'
      - 'PROJECTS/ChatBackup PC Tool/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exact frozen R5.5 source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin ${GITHUB_SHA}
          git sparse-checkout init --no-cone
          git sparse-checkout set 'PROJECTS/ChatBackup PC Tool/**'
          git -c core.autocrlf=false checkout --force FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f 'PROJECTS/ChatBackup PC Tool/BUILD_EXE.bat'
          test -f 'PROJECTS/ChatBackup PC Tool/666_CHATBACKUP_MENUE.bat'
          test -f 'PROJECTS/ChatBackup PC Tool/app/chatbackup_gui.pyw'
          test -f 'PROJECTS/ChatBackup PC Tool/tools/archive_branch_tree_ui.py'
          echo 'FROZEN_SOURCE_READBACK_PASS'
      - name: Bundle complete frozen source, original build scripts, assets and tests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('PROJECTS/ChatBackup PC Tool')
          dest=pathlib.Path('output')
          dest.mkdir()
          basename='666_CHATBACKUP_PC_TOOL_R55_SINGLE_EXE_FULL_SOURCE'
          filename=dest/(basename+'.zip')
          source_files=[p for p in root.rglob('*') if p.is_file()]
          assert len(source_files)>150, 'Incomplete source inventory'
          build_text=(root/'BUILD_EXE.bat').read_text('utf-8')
          assert '666_CHATBACKUP_ARCHIVE_INTELLIGENCE.spec' not in build_text
          assert '666_CHATBACKUP_PC_TOOL.spec' in (root/'666_CHATBACKUP_MENUE.bat').read_text('utf-8')
          extra = {
            'ANLEITUNG_SELBST_KOMPILIEREN.md': '''# 666 CHATBACKUP PC TOOL - R5.5 VOLLSTAENDIGES QUELLPAKET

          **Originalprogramm:** 666 CHATBACKUP PC TOOL v1.10.5, additiv mit R5.5 erweitert.
          **Verifizierter Freeze-Commit:** ${GITHUB_SHA}
          **Produktiver Branch:** Nicht veraendert. Entwicklungs-/Buildkandidat.

          ## Windows: Selber kompilieren
          1. Dieses ZIP in einen eigenen Ordner vollstaendig entpacken.
          2. Erst bei Bedarf bestehende Python-/Windows-Umgebung sichern, da der Bootstrap Abhaengigkeiten installieren/aktualisieren kann.
          3. `666_CHATBACKUP_MENUE.bat` per Doppelklick starten und Option 2 auswaehlen.
          4. Fertige Datei: `dist/666_CHATBACKUP_PC_TOOL.exe`.
          5. Der bestehende Originalstarter `BUILD_EXE.bat` baut jetzt ebenfalls nur die eine Haupt-EXE. Die alte zweite EXE wird nicht mehr gebaut.
          6. `VERIFY_WINDOWS_HOST_ACCEPTANCE.bat` ist der urspruengliche Windows-Hosttest mit optionalem oeffentlichem Share-Link. Echte Daten nur freiwillig und mit eigener Freigabe verwenden.
          7. Vor produktivem Einsatz GUI und Exportfunktionen auf dem eigenen Windows-System pruefen.

          ## Erhaltene Projektteile
          - `app/chatbackup_gui.pyw` und `666_CHATBACKUP_PC_TOOL.spec`: unveraenderte Originalidentitaet und erweiterter Code
          - `app/`, `tools/`, `tests/`, `bootstrap/`, `assets/`: Quelle, Suche, Baumansicht, Testfaelle und Build-Assets
          - `mobile_scriptable/`: bestehender iPhone-Companion
          - `CURRENT_RELEASE_INDEX.md`, `MANIFEST.sha256`: native Evidenz und bisheriger Versionsstand
          - Historische Projektdateien bleiben vorhanden; keine Umbenennung und kein automatischer Merge.

          ## Paketverifikation
          `PACKAGE_FILES_SHA256.txt` listet jede gepackte Quelldatei. Dieses Paket wurde aus dem exakten eingefrorenen Commit uebernommen.
          '''.replace('\n          ','\n')
          }
          lines=[]
          with zipfile.ZipFile(filename,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(source_files):
              rel=p.relative_to(root).as_posix()
              data=p.read_bytes()
              z.writestr(basename+'/'+rel,data)
              lines.append(hashlib.sha256(data).hexdigest()+'  '+rel)
            for rel,data in extra.items():
              raw=data.encode('utf-8')
              z.writestr(basename+'/'+rel,raw)
              lines.append(hashlib.sha256(raw).hexdigest()+'  '+rel)
            z.writestr(basename+'/PACKAGE_FILES_SHA256.txt','\n'.join(sorted(lines))+'\n')
          with zipfile.ZipFile(filename) as z:
            assert z.testzip() is None
            assert len(z.namelist())==len(source_files)+len(extra)+1
          print('SOURCE_PACKAGE_PASS',len(source_files),'source files',filename,filename.stat().st_size)
          print('ZIP_SHA256',hashlib.sha256(filename.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 666_CHATBACKUP_PC_TOOL_R55_SINGLE_EXE_FULL_SOURCE
          path: output/666_CHATBACKUP_PC_TOOL_R55_SINGLE_EXE_FULL_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
