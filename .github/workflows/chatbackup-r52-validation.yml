name: ChatBackup R5.2 streaming & GUI regression
on:
  push:
    branches:
      - feature/chatbackup-archive-intelligence-r5-20261120
    paths:
      - .github/workflows/chatbackup-r52-validation.yml
      - 'PROJECTS/ChatBackup PC Tool/app/archive_extensions.py'
      - 'PROJECTS/ChatBackup PC Tool/app/archive_streaming.py'
      - 'PROJECTS/ChatBackup PC Tool/tests/test_archive_streaming.py'
      - 'PROJECTS/ChatBackup PC Tool/tests/test_archive_extensions.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'PROJECTS/ChatBackup PC Tool'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest 'Pillow>=11,<13'
      - name: Streaming and optional archive regression
        run: python -m pytest -q tests/test_archive_intelligence.py tests/test_archive_extensions.py tests/test_archive_streaming.py
      - name: Whole ChatBackup regression
        run: python -m pytest -q tests
      - name: Existing baseline
        run: python tests/run_tests.py
      - name: Existing Scriptable checks
        run: |
          node mobile_scriptable/source/tests/host_acceptance.test.cjs mobile_scriptable/source/666_CHATBACKUP_SCRIPTABLE_IPHONE_v1.0.9.js
          node mobile_scriptable/source/tests/image_download_security.test.cjs
      - name: Syntax and optional interface checks
        run: |
          python -m py_compile app/archive_intelligence.py app/archive_extensions.py app/archive_streaming.py app/archive_research.py app/chatbackup_gui.py app/chatbackup_gui.pyw tools/archive_intelligence_gui.py tools/archive_intelligence_cli.py
          python tools/archive_intelligence_cli.py --help
      - name: Bind changed source and tests to SHA-256 manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          manifest=Path('MANIFEST.sha256')
          content=manifest.read_text(encoding='utf-8')
          items=['app/archive_streaming.py','app/archive_extensions.py',
                 'app/archive_intelligence.py','app/chatbackup_gui.pyw',
                 'app/chatbackup_gui.py','tools/archive_intelligence_gui.py',
                 'tests/test_archive_streaming.py','tests/test_archive_extensions.py']
          for name in items:
              f=Path(name)
              assert f.is_file(),name
              digest=hashlib.sha256(f.read_bytes()).hexdigest()
              record=digest+' *./'+name
              regex=r'^[0-9a-f]{64} \*\./'+re.escape(name)+r'$'
              if re.search(regex,content,re.MULTILINE):
                  content=re.sub(regex,lambda _:record,content,flags=re.MULTILINE)
              else:content=content.rstrip('\n')+'\n'+record+'\n'
          manifest.write_text(content,encoding='utf-8')
          print('R52_MANIFEST_ENTRIES',len(items))
          PY
      - name: Release integrity after scoped hash update
        run: python tests/release_integrity_probe.py
      - name: Persist SHA-256 manifest only if regression PASS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          git diff --cached --check
          git commit -m 'test(chatbackup R5.2): bind validated streaming and UI additions to manifest'
          git push origin HEAD:feature/chatbackup-archive-intelligence-r5-20261120
