name: ChatBackup R5.5 PR regression (read-only)
on:
  push:
    branches:
      - feature/chatbackup-r55-source-relocation-20261121
    paths:
      - '.github/workflows/chatbackup-r55-pr-regression.yml'
      - 'PROJECTS/ChatBackup PC Tool/**'
  pull_request:
    branches:
      - 666MAIN_BRAIN
    paths:
      - '.github/workflows/chatbackup-r55-pr-regression.yml'
      - 'PROJECTS/ChatBackup PC Tool/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'PROJECTS/ChatBackup PC Tool'
    steps:
      - name: Scoped Git checkout without unrelated submodule enumeration
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin "${GITHUB_SHA}"
          git sparse-checkout init --no-cone
          git sparse-checkout set 'PROJECTS/ChatBackup PC Tool/**'
          git -c core.autocrlf=false checkout --force FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test -f 'PROJECTS/ChatBackup PC Tool/app/archive_source_relocation.py'
          echo "R55_SCOPED_SOURCE_CHECKOUT_PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'Pillow>=11,<13'
      - name: R5.5 source relocation regression
        run: python -m pytest -q tests/test_archive_source_relocation.py
      - name: Full ChatBackup Python regression
        run: python -m pytest -q tests
      - name: Existing baseline regression
        run: python tests/run_tests.py
      - name: Existing release integrity
        run: python tests/release_integrity_probe.py
      - name: Scriptable existing simulation
        run: |
          node mobile_scriptable/source/tests/host_acceptance.test.cjs mobile_scriptable/source/666_CHATBACKUP_SCRIPTABLE_IPHONE_v1.0.9.js
          node mobile_scriptable/source/tests/image_download_security.test.cjs
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 'PROJECTS/ChatBackup PC Tool'
    steps:
      - name: Scoped Git checkout without unrelated submodule enumeration
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin "${GITHUB_SHA}"
          git sparse-checkout init --no-cone
          git sparse-checkout set 'PROJECTS/ChatBackup PC Tool/**'
          git -c core.autocrlf=false checkout --force FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test -f 'PROJECTS/ChatBackup PC Tool/app/archive_source_relocation.py'
          echo "R55_SCOPED_SOURCE_CHECKOUT_PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest 'Pillow>=11,<13'
      - name: R5.5 relocation regression on Windows
        shell: pwsh
        run: python -m pytest -q tests/test_archive_source_relocation.py
      - name: All existing Python regression tests
        shell: pwsh
        run: python -m pytest -q tests
      - name: Baseline and integrity
        shell: pwsh
        run: |
          python tests/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/release_integrity_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-build-original-exe:
    name: Build original 666_CHATBACKUP_PC_TOOL.exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 'PROJECTS/ChatBackup PC Tool'
    steps:
      - name: Checkout exact candidate without unrelated submodules
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin "${GITHUB_SHA}"
          git sparse-checkout init --no-cone
          git sparse-checkout set 'PROJECTS/ChatBackup PC Tool/**'
          git -c core.autocrlf=false checkout --force FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test -f 'PROJECTS/ChatBackup PC Tool/666_CHATBACKUP_PC_TOOL.spec'
          test -f 'PROJECTS/ChatBackup PC Tool/app/chatbackup_gui.pyw'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows EXE build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'pyinstaller>=6,<7' 'Pillow>=11,<13' 'pywinauto>=0.6.8,<0.7' 'psutil>=5,<8' 'pyautogui>=0.9,<1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build original unchanged EXE name from primary entrypoint
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean .\666_CHATBACKUP_PC_TOOL.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path (Get-Location) 'dist\666_CHATBACKUP_PC_TOOL.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'ORIGINAL_PC_TOOL_EXE_NOT_CREATED' }
          $file = Get-Item -LiteralPath $exe
          if ($file.Length -lt 1000000) { throw 'ORIGINAL_PC_TOOL_EXE_TOO_SMALL' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          Write-Host "ORIGINAL_PC_TOOL_EXE_BUILD_PASS bytes=$($file.Length) sha256=$hash"
      - name: Windows process-start smoke check (not visual host acceptance)
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'dist\666_CHATBACKUP_PC_TOOL.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) {
              throw "ORIGINAL_PC_TOOL_EXE_EXITED_EARLY code=$($process.ExitCode)"
            }
            Write-Host 'ORIGINAL_PC_TOOL_EXE_PROCESS_START_PASS_NONVISUAL'
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Exercise real Windows Tkinter windows and controls (source host)
        shell: pwsh
        run: |
          python tests/windows_gui_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = 'runtime_readback/WINDOWS_GUI_CI_PROBE.json'
          if (!(Test-Path -LiteralPath $report)) { throw 'WINDOWS_GUI_READBACK_NOT_CREATED' }
          Get-Content -LiteralPath $report
      - name: External UI Automation of built original EXE
        shell: pwsh
        run: |
          python tests/windows_compiled_exe_gui_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -LiteralPath 'runtime_readback/WINDOWS_COMPILED_EXE_GUI_PROBE.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 666_CHATBACKUP_R55_COMPILED_EXE_GUI_READBACK
          path: |
            PROJECTS/ChatBackup PC Tool/runtime_readback/WINDOWS_COMPILED_EXE_GUI_PROBE.json
            PROJECTS/ChatBackup PC Tool/runtime_readback/gui_screenshots/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 666_CHATBACKUP_R55_WINDOWS_GUI_HOST_REPORT
          path: PROJECTS/ChatBackup PC Tool/runtime_readback/WINDOWS_GUI_CI_PROBE.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: 666_CHATBACKUP_PC_TOOL_R55_WINDOWS_CANDIDATE
          path: PROJECTS/ChatBackup PC Tool/dist/666_CHATBACKUP_PC_TOOL.exe
          if-no-files-found: error
          retention-days: 7

  package-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exact frozen R5.5 source checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --no-tags --no-recurse-submodules origin fb6f620d2f85b17f3f7e82dc0a1ad6e465e9d96e
          git sparse-checkout init --no-cone
          git sparse-checkout set 'PROJECTS/ChatBackup PC Tool/**'
          git -c core.autocrlf=false checkout --force FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "fb6f620d2f85b17f3f7e82dc0a1ad6e465e9d96e"
          test -f 'PROJECTS/ChatBackup PC Tool/BUILD_EXE.bat'
          test -f 'PROJECTS/ChatBackup PC Tool/app/chatbackup_gui.pyw'
          test -f 'PROJECTS/ChatBackup PC Tool/tools/archive_branch_tree_ui.py'
          echo 'FROZEN_SOURCE_READBACK_PASS'
      - name: Bundle complete frozen source, original build scripts, assets and tests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('PROJECTS/ChatBackup PC Tool')
          dest=pathlib.Path('output')
          dest.mkdir()
          basename='666_CHATBACKUP_PC_TOOL_R55_FULL_SOURCE'
          filename=dest/(basename+'.zip')
          source_files=[p for p in root.rglob('*') if p.is_file()]
          assert len(source_files)>100, 'Incomplete source inventory'
          extra = {
            'BUILD_NUR_HAUPTPROGRAMM.cmd': r'''@echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          title 666 ChatBackup PC Tool - Originales Hauptprogramm selbst kompilieren
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0bootstrap\bootstrap.ps1" -Mode Build
          if errorlevel 1 goto error
          if not exist ".venv-build\Scripts\python.exe" goto error
          ".venv-build\Scripts\python.exe" -m PyInstaller --noconfirm --clean "666_CHATBACKUP_PC_TOOL.spec"
          if errorlevel 1 goto error
          if not exist "dist\666_CHATBACKUP_PC_TOOL.exe" goto error
          echo [PASS] dist\666_CHATBACKUP_PC_TOOL.exe erstellt.
          pause
          exit /b 0
          :error
          echo [FAIL] Build konnte nicht abgeschlossen werden.
          pause
          exit /b 1
          '''.replace('\n          ','\n'),
            'ANLEITUNG_SELBST_KOMPILIEREN.md': '''# 666 CHATBACKUP PC TOOL - R5.5 VOLLSTAENDIGES QUELLPAKET

          **Originalprogramm:** 666 CHATBACKUP PC TOOL v1.10.5, additiv mit R5.5 erweitert.
          **Verifizierter Freeze-Commit:** fb6f620d2f85b17f3f7e82dc0a1ad6e465e9d96e
          **Produktiver Branch:** Nicht veraendert. Entwicklungs-/Buildkandidat.

          ## Windows: Selber kompilieren
          1. Dieses ZIP in einen eigenen Ordner vollstaendig entpacken.
          2. Erst bei Bedarf bestehende Python-/Windows-Umgebung sichern, da der Bootstrap Abhaengigkeiten installieren/aktualisieren kann.
          3. `BUILD_NUR_HAUPTPROGRAMM.cmd` per Doppelklick ausfuehren.
          4. Fertige Datei: `dist/666_CHATBACKUP_PC_TOOL.exe`.
          5. Alternativ den erhaltenen Originalstarter `BUILD_EXE.bat` ausfuehren: baut das Hauptprogramm und anschliessend den optionalen Archive-Companion.
          6. `VERIFY_WINDOWS_HOST_ACCEPTANCE.bat` ist der urspruengliche Windows-Hosttest mit optionalem oeffentlichem Share-Link. Echte Daten nur freiwillig und mit eigener Freigabe verwenden.
          7. Vor produktivem Einsatz GUI und Exportfunktionen auf dem eigenen Windows-System pruefen.

          ## Erhaltene Projektteile
          - `app/chatbackup_gui.pyw` und `666_CHATBACKUP_PC_TOOL.spec`: unveraenderte Originalidentitaet und erweiterter Code
          - `app/`, `tools/`, `tests/`, `bootstrap/`, `assets/`: Quelle, Suche, Baumansicht, Testfaelle und Build-Assets
          - `mobile_scriptable/`: bestehender iPhone-Companion
          - `CURRENT_RELEASE_INDEX.md`, `MANIFEST.sha256`: native Evidenz und bisheriger Versionsstand
          - Historische Projektdateien bleiben vorhanden; keine Umbenennung und kein automatischer Merge.

          ## Paketverifikation
          `PACKAGE_FILES_SHA256.txt` listet jede gepackte Quelldatei. Dieses Paket wurde aus dem exakten eingefrorenen Commit uebernommen.
          '''.replace('\n          ','\n')
          }
          lines=[]
          with zipfile.ZipFile(filename,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(source_files):
              rel=p.relative_to(root).as_posix()
              data=p.read_bytes()
              z.writestr(basename+'/'+rel,data)
              lines.append(hashlib.sha256(data).hexdigest()+'  '+rel)
            for rel,data in extra.items():
              raw=data.encode('utf-8')
              z.writestr(basename+'/'+rel,raw)
              lines.append(hashlib.sha256(raw).hexdigest()+'  '+rel)
            z.writestr(basename+'/PACKAGE_FILES_SHA256.txt','\n'.join(sorted(lines))+'\n')
          with zipfile.ZipFile(filename) as z:
            assert z.testzip() is None
            assert len(z.namelist())==len(source_files)+len(extra)+1
          print('SOURCE_PACKAGE_PASS',len(source_files),'source files',filename,filename.stat().st_size)
          print('ZIP_SHA256',hashlib.sha256(filename.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 666_CHATBACKUP_PC_TOOL_R55_FULL_SOURCE
          path: output/666_CHATBACKUP_PC_TOOL_R55_FULL_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
