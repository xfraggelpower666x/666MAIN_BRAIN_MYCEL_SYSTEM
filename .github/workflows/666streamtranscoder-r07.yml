name: 666StreamTranscoder Resin 3 R07 unit acceptance

on:
  push:
    branches: [666MAIN_BRAIN, 'feature/666streamtranscoder-*']
    paths:
      - 'PROJECTS/666StreamTranscoder/**'
      - '.github/workflows/666streamtranscoder-r07.yml'
  pull_request:
    branches: [666MAIN_BRAIN]
    paths:
      - 'PROJECTS/666StreamTranscoder/**'
      - '.github/workflows/666streamtranscoder-r07.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 666streamtranscoder-r07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resin3-python-contracts:
    name: Resin 3 contract tests (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: PROJECTS/666StreamTranscoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python compilation
        run: python -m compileall -q radiostreamer tests/test_resin3_control_plane.py tests/test_resin3_modules.py tests/test_resin3_runtime_boundaries.py tests/test_crossfade_audio.py tests/test_pipe_lifecycle.py tests/test_device_routing.py tests/test_windows_endpoint_ids.py
      - name: R13 desktop telemetry privacy and atomic-write tests
        run: python -m unittest discover -s tests -p 'test_desktop_status.py' -v
      - name: Resin 3 contract suite (no audio device, no provider, no credentials)
        run: python -m unittest discover -s tests -p 'test_resin3_*.py' -v
      - name: Crossfade pure PCM tests
        run: python -m unittest discover -s tests -p 'test_crossfade_audio.py' -v
      - name: FFmpeg process and pipe lifecycle regression tests
        run: python -m unittest discover -s tests -p 'test_pipe_lifecycle.py' -v
      - name: R10 deterministic device routing and real loopback socket failure tests
        run: python -m unittest discover -s tests -p 'test_device_routing.py' -v
      - name: R11 stable Windows IMMDevice identity contracts (mocked inventory)
        run: python -m unittest discover -s tests -p 'test_windows_endpoint_ids.py' -v
      - name: Install FFmpeg on the isolated CI runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Real FFmpeg -> PCM -> MP3 -> localhost HTTP listener
        run: |
          ffmpeg -hide_banner -encoders | grep -q libmp3lame
          python -m unittest discover -s tests -p 'test_e2e_synthetic.py' -v

  windows-coreaudio-smoke:
    name: R11 native Windows MMDevice smoke (not physical hardware acceptance)
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: PROJECTS/666StreamTranscoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Windows device adapter
        run: python -m compileall -q radiostreamer/resin3/windows_endpoints.py scripts/windows_hardware_probe.py
      - name: Core Audio identity contract tests
        run: python -m unittest discover -s tests -p 'test_windows_endpoint_ids.py' -v
      - name: Read-only IMMDevice enumeration on Windows runner
        run: python scripts/windows_hardware_probe.py --json

  electron-readonly-status:
    name: Electron R13 read-only contract tests (no broadcast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: PROJECTS/666StreamTranscoder/electron-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Electron code without installing packages
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check renderer.js
          node --check status-contract.cjs
      - name: Security and stale-status tests
        run: node --test tests/*.test.cjs
