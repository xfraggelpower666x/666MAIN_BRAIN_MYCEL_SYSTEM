name: ChatBackup migration regression and integrity
on:
  push:
    branches:
      - migration/chatbackup-r1-detach-20261120
    paths:
      - .github/workflows/chatbackup-migration-tests.yml
      - PROJECTS/ChatBackup PC Tool/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/chatbackup-r1-detach-20261120
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test requirements
        run: python -m pip install pytest Pillow
      - name: Run verified local tests (not physical host acceptance)
        working-directory: PROJECTS/ChatBackup PC Tool
        run: |
          python -m pytest -q tests
          python tests/run_tests.py
          python tests/release_integrity_probe.py
          node mobile_scriptable/source/tests/host_acceptance.test.cjs mobile_scriptable/source/666_CHATBACKUP_SCRIPTABLE_IPHONE_v1.0.9.js
      - name: Verify legacy mirror SHA without extracting archive
        working-directory: PROJECTS/ChatBackup PC Tool
        run: |
          test "$(git hash-object provenance/pfs-child-history/backup/2026-10-28_VERIFIED_ORIGINALS/666_CHATBACKUP_PC_TOOL_v1.10.0.zip)" = 75547ff2dcd365b30a434d546803ae773ce07bc6
