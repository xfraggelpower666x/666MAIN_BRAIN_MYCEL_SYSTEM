name: ChatBackup readback receipt (migration)
on:
  push:
    branches:
      - migration/chatbackup-r1-detach-20261120
    paths:
      - .github/workflows/chatbackup-regression-receipt.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/chatbackup-r1-detach-20261120
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest Pillow
      - name: Capture scoped local regression receipts
        shell: bash
        run: |
          set -uo pipefail
          cd "PROJECTS/ChatBackup PC Tool"
          mkdir -p provenance
          set +e
          python -m pytest -q tests > /tmp/chatbackup-pytest.log 2>&1
          a=$?
          python tests/run_tests.py > /tmp/chatbackup-baseline.log 2>&1
          b=$?
          python tests/release_integrity_probe.py > /tmp/chatbackup-integrity.log 2>&1
          c=$?
          node mobile_scriptable/source/tests/host_acceptance.test.cjs mobile_scriptable/source/666_CHATBACKUP_SCRIPTABLE_IPHONE_v1.0.9.js > /tmp/chatbackup-node.log 2>&1
          d=$?
          git hash-object provenance/pfs-child-history/backup/2026-10-28_VERIFIED_ORIGINALS/666_CHATBACKUP_PC_TOOL_v1.10.0.zip > /tmp/chatbackup-legacy-hash.log
          e=$?
          export P_A="$a" P_B="$b" P_C="$c" P_D="$d" P_E="$e"
          python - <<'PY'
          import json,os,pathlib,datetime
          p=pathlib.Path("provenance/REPO_REGRESSION_READBACK.json")
          names=[("pytest","P_A","/tmp/chatbackup-pytest.log"),("baseline","P_B","/tmp/chatbackup-baseline.log"),("integrity","P_C","/tmp/chatbackup-integrity.log"),("scriptable_node","P_D","/tmp/chatbackup-node.log"),("pfs_binary_hash","P_E","/tmp/chatbackup-legacy-hash.log")]
          tests={}
          for name,k,f in names:
              t=pathlib.Path(f).read_text(errors="replace") if pathlib.Path(f).exists() else ""
              tests[name]={"exit_code":int(os.environ[k]),"tail":t[-900:]}
          observed=pathlib.Path("/tmp/chatbackup-legacy-hash.log").read_text().strip()
          tests["pfs_binary_hash"]["match"]=observed=="75547ff2dcd365b30a434d546803ae773ce07bc6"
          result={"schema":"chatbackup.repo-regression.v1","date_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"source":"github-actions-linux","physical_windows_host":"READBACK_PENDING","physical_iphone_host":"READBACK_PENDING","tests":tests}
          result["status"]="PASS" if all(x["exit_code"]==0 for x in tests.values()) and tests["pfs_binary_hash"]["match"] else "FAIL"
          p.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("REGRESSION_STATUS="+result["status"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/REPO_REGRESSION_READBACK.json
          git commit -m "test(chatbackup): record GitHub branch regression and legacy blob readback"
          git push origin HEAD:migration/chatbackup-r1-detach-20261120
