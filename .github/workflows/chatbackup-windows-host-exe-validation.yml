name: ChatBackup Windows host and EXE validation
on:
  push:
    branches:
      - 666MAIN_BRAIN
      - feature/chatbackup-r53-automated-dual-exe-20261121
    paths:
      - .github/workflows/chatbackup-windows-host-exe-validation.yml
      - 'PROJECTS/ChatBackup PC Tool/**'
  workflow_dispatch:
    inputs:
      public_share_url:
        description: 'Optional public ChatGPT share URL for Windows runner live parser test. Do not enter private tokens.'
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows-host-build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 'PROJECTS/ChatBackup PC Tool'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PROJECTS/ChatBackup PC Tool
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Restore exact manifest-bound Git blobs in Windows checkout
        shell: pwsh
        run: |
          @'
          import hashlib
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd().resolve()
          manifest = root / "MANIFEST.sha256"
          fixed = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              match = re.fullmatch(r"([0-9a-f]{64})\\s+\\*?(.+)", line)
              if not match:
                  raise ValueError("Invalid SHA-256 manifest line")
              expected, relative = match.groups()
              rel = pathlib.PurePosixPath(relative.replace("\\\\", "/").removeprefix("./"))
              if rel.is_absolute() or ".." in rel.parts:
                  raise ValueError("Unsafe manifest path")
              target = root.joinpath(*rel.parts)
              if not target.is_file():
                  raise FileNotFoundError(str(rel))
              if hashlib.sha256(target.read_bytes()).hexdigest() == expected:
                  continue
              blob_name = "PROJECTS/ChatBackup PC Tool/" + rel.as_posix()
              original = subprocess.check_output(["git", "show", "HEAD:" + blob_name])
              if hashlib.sha256(original).hexdigest() != expected:
                  raise ValueError("Manifest does not match authoritative Git blob: " + blob_name)
              target.write_bytes(original)
              fixed += 1
          print("WINDOWS_GIT_BLOB_SHA256_READBACK_PASS", fixed, "file(s) restored")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies (isolated runner only)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-runtime.txt -r requirements-build.txt pytest
      - name: Unit regression + integrity
        shell: pwsh
        run: |
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/release_integrity_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows Tkinter GUI and browser recovery readback
        shell: pwsh
        run: |
          python tests/runtime_readback_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows fixture host pipeline (must NOT promote to live PASS)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python tests/host_acceptance_probe.py --fixture
          if ($LASTEXITCODE -ne 3) { throw "Expected fixture exit 3 (host gate open); got $LASTEXITCODE" }
          exit 0
      - name: Optional Windows runner live public Share parse and readback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_share_url != '' }}
        env:
          CHATBACKUP_PUBLIC_SHARE_URL: ${{ inputs.public_share_url }}
        shell: pwsh
        run: |
          python tests/host_acceptance_probe.py --share-url "$env:CHATBACKUP_PUBLIC_SHARE_URL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows EXE with existing PyInstaller spec
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean 666_CHATBACKUP_PC_TOOL.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/666_CHATBACKUP_PC_TOOL.exe')) { throw 'EXE missing' }
          Get-FileHash 'dist/666_CHATBACKUP_PC_TOOL.exe' -Algorithm SHA256 | Format-List
      - name: Build optional Archive Intelligence companion EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean 666_CHATBACKUP_ARCHIVE_INTELLIGENCE.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe')) { throw 'Archive companion EXE missing' }
          Get-FileHash 'dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe' -Algorithm SHA256 | Format-List
      - name: EXE existence, PE header and startup smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/666_CHATBACKUP_PC_TOOL.exe').Path
          $stream = [IO.File]::OpenRead($exe)
          try {
            $head = New-Object byte[] 2
            [void]$stream.Read($head,0,2)
            if ($head[0] -ne 77 -or $head[1] -ne 90) { throw 'Invalid PE DOS header' }
          } finally { $stream.Dispose() }
          $proc = Start-Process -FilePath $exe -PassThru -WorkingDirectory (Get-Location).Path
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "EXE exited unexpectedly, code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          $archive = (Resolve-Path 'dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe').Path
          $stream = [IO.File]::OpenRead($archive)
          try {
            $head = New-Object byte[] 2
            [void]$stream.Read($head,0,2)
            if ($head[0] -ne 77 -or $head[1] -ne 90) { throw 'Invalid companion PE header' }
          } finally { $stream.Dispose() }
          $companionProc = Start-Process -FilePath $archive -PassThru -WorkingDirectory (Get-Location).Path
          Start-Sleep -Seconds 8
          $companionProc.Refresh()
          if ($companionProc.HasExited) { throw "Archive EXE exited unexpectedly, code $($companionProc.ExitCode)" }
          Stop-Process -Id $companionProc.Id -Force
          Write-Host 'WINDOWS_DUAL_EXE_STARTUP_SMOKE_PASS (no real user interaction)'
      - name: Collect Windows CI evidence (no chat content)
        if: always()
        shell: pwsh
        run: |
          $out = 'runtime_readback/windows_ci_evidence.json'
          New-Item -ItemType Directory -Force runtime_readback | Out-Null
          $exe = 'dist/666_CHATBACKUP_PC_TOOL.exe'
          $state = [ordered]@{
            schema = '666.chatbackup.windows-ci-evidence.v1'
            mode = 'github-actions-windows-runner'
            doesNotClosePhysicalUserDeviceGate = $true
            runId = '$env:GITHUB_RUN_ID'
            commit = '$env:GITHUB_SHA'
            exePresent = Test-Path $exe
            exeSha256 = if (Test-Path $exe) { (Get-FileHash $exe -Algorithm SHA256).Hash } else { $null }
            companionExePresent = Test-Path 'dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe'
            companionSha256 = if (Test-Path 'dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe') { (Get-FileHash 'dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe' -Algorithm SHA256).Hash } else { $null }
            runtimeReceiptPresent = Test-Path runtime_readback/windows_runtime_readback.json
          }
          $state | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $out
      - name: Upload Windows CI receipts and EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbackup-windows-exe-and-ci-receipts
          path: |
            PROJECTS/ChatBackup PC Tool/dist/666_CHATBACKUP_PC_TOOL.exe
            PROJECTS/ChatBackup PC Tool/dist/666_CHATBACKUP_ARCHIVE_INTELLIGENCE.exe
            PROJECTS/ChatBackup PC Tool/runtime_readback/windows_ci_evidence.json
            PROJECTS/ChatBackup PC Tool/runtime_readback/windows_runtime_readback.json
          if-no-files-found: warn
          retention-days: 14
