name: ChatBackup Windows x64 redistributable offline Python build tools
on:
  push:
    branches:
      - feature/chatbackup-r55-source-relocation-20261121
    paths:
      - '.github/workflows/chatbackup-r55-windows-offline-toolchain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-build-toolchain:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Download signed official Python x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path offline/python | Out-Null
          $url='https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile 'offline/python/python-3.12.10-amd64.exe'
          $sig=Get-AuthenticodeSignature 'offline/python/python-3.12.10-amd64.exe'
          if ($sig.Status -ne 'Valid') { throw "Official Python Authenticode signature invalid: $($sig.Status)" }
          Get-FileHash -Algorithm SHA256 'offline/python/python-3.12.10-amd64.exe'
      - name: Resolve complete Windows x64 pip wheelhouse for offline compilation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path offline/wheels | Out-Null
          python -m pip download --disable-pip-version-check --only-binary=:all: --dest offline/wheels 'pyinstaller>=6.17,<7.0' 'Pillow>=11,<13' pytest
          if ($LASTEXITCODE -ne 0) { throw 'Wheelhouse download failed' }
      - name: Install all compiler dependencies without network
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m venv verify-wheelhouse
          & .\verify-wheelhouse\Scripts\python.exe -m pip install --disable-pip-version-check --no-index --find-links offline/wheels 'pyinstaller>=6.17,<7.0' 'Pillow>=11,<13' pytest
          if ($LASTEXITCODE -ne 0) { throw 'OFFLINE_WHEELHOUSE_TEST_FAILED' }
          & .\verify-wheelhouse\Scripts\python.exe -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) { throw 'Offline PyInstaller not runnable' }
      - name: Create manifest and source-compatible toolchain ZIP
        shell: pwsh
        run: |
          @'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('offline')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          assert len(files)>=6
          receipt={'schema':'666.chatbackup.offline-build-tools.v1','platform':'win_amd64',
            'python':'3.12.10','files':{p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          root.joinpath('TOOLCHAIN_MANIFEST.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          target=pathlib.Path('666_CHATBACKUP_R55_OFFLINE_BUILD_TOOLS_WINDOWS_X64.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.as_posix())
          with zipfile.ZipFile(target) as z: assert z.testzip() is None
          print('OFFLINE_TOOLCHAIN_PASS',len(files),target.stat().st_size)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain pack failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: 666_CHATBACKUP_R55_OFFLINE_BUILD_TOOLS_WINDOWS_X64
          path: 666_CHATBACKUP_R55_OFFLINE_BUILD_TOOLS_WINDOWS_X64.zip
          if-no-files-found: error
          retention-days: 7
