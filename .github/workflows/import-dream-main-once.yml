name: One-time verified Dream source import
on:
  push:
    branches: [666MAIN_BRAIN]
    paths:
      - '.github/workflows/import-dream-main-once.yml'
permissions:
  contents: write
concurrency:
  group: dream-main-one-time-import
  cancel-in-progress: false
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 666MAIN_BRAIN
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and import exact uploaded Dream source as editable files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e PROJECTS/dream-main || { echo "Destination already exists; refusing overwrite"; exit 1; }
          git clone -q https://github.com/Deaeath/dream.git /tmp/dream-source
          git -C /tmp/dream-source checkout -q --detach 06b0f132e187f8058d60a54f66ad259a4718e1a6
          cd /tmp/dream-source
          cat > /tmp/dream-hashes <<'EOF'
          .nojekyll e69de29bb2d1d6434b8b29ae775ad8c2e48c5391
          README.md a409c02e0162647d1bfd69e6883cb81f335e28fe
          img/avatar.jpg ec27edfc7bc1874b4bbccfaef47e78b75423ff31
          img/editor.jpg 9be5396c61b3d2211c41e479fde592014c85b35b
          img/forge.jpg 8268f1614acc127f17ca26efe34c0cdc9e8b6397
          img/hyperreal.jpg 9354f65f4cd5b7a8f6a1af70adb4d3c96d45bccd
          img/kinklist.jpg 0cece011112735ff4c9d8d8f7e619bec55f0d8f2
          img/modkit.png c03c49c6a5d82220ca120eb66a035b3074aade6f
          img/profile.png 198de4ad88014ae17eef3cebc232f27a9bfb3458
          img/radio.png 5e723237db33f7ffcf50457ce693fb15a020a012
          img/remoteplay.png 19a0371bfc63c1a2b77620714b9c0074a3741e97
          img/toolkit.png 8fc6337913f8dd05ddab0129258a4c89b9bd9eac
          index.html 13e2a0d78f6bbacbbf88f3b6e304c384e22f6219
          EOF
          while read -r file expected; do
            test -f "$file"
            actual="$(git hash-object "$file")"
            test "$actual" = "$expected" || { echo "Checksum mismatch: $file"; exit 1; }
          done < /tmp/dream-hashes
          test "$(git ls-files | wc -l)" -eq 13
          cd "$GITHUB_WORKSPACE"
          mkdir -p PROJECTS/dream-main
          cp -a /tmp/dream-source/.nojekyll /tmp/dream-source/README.md /tmp/dream-source/index.html /tmp/dream-source/img PROJECTS/dream-main/
          git add PROJECTS/dream-main
          git rm .github/workflows/import-dream-main-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import verified Dream website source into PROJECTS/dream-main"
          git fetch origin 666MAIN_BRAIN
          git rebase origin/666MAIN_BRAIN
          git push origin HEAD:666MAIN_BRAIN
