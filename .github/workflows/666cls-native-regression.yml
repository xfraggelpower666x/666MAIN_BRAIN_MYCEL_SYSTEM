name: 666CLS native regression (read-only)
on:
  push:
    branches:
      - 666MAIN_BRAIN
      - candidate/666cls-r02-20261121
    paths:
      - '.github/workflows/666cls-native-regression.yml'
      - 'PROJECTS/666CLS/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cls-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full CLS native suite
        run: python -m unittest discover -s PROJECTS/666CLS/tests -p 'test_*.py' -v
