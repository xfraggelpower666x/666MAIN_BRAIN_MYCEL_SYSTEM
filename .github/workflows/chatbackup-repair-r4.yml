name: ChatBackup scoped R4 repair regression
on:
  push:
    branches:
      - repair/chatbackup-network-hardening-20261120
    paths:
      - .github/workflows/chatbackup-repair-r4.yml
      - 'PROJECTS/ChatBackup PC Tool/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'PROJECTS/ChatBackup PC Tool'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline testing dependencies
        run: python -m pip install pytest Pillow
      - name: Python security and functional regression
        run: python -m pytest -q tests
      - name: Legacy baseline regression
        run: python tests/run_tests.py
      - name: PC and Scriptable ZIP integrity
        run: python tests/release_integrity_probe.py
      - name: Scriptable established host-acceptance simulation
        run: node mobile_scriptable/source/tests/host_acceptance.test.cjs mobile_scriptable/source/666_CHATBACKUP_SCRIPTABLE_IPHONE_v1.0.9.js
      - name: Scriptable new security tests
        run: node mobile_scriptable/source/tests/image_download_security.test.cjs
