name: MYCEL repository checks (read-only)

on:
  push:
    branches:
      - 666MAIN_BRAIN
    paths:
      - '.github/workflows/mycel-repository-checks.yml'
      - 'INTEGRATIONS/PSYLLO_CODING/workbench/**'
      - 'UI/INTELLIGENT_UI/**'
      - 'DAEMON/**'
      - 'RUNTIME/RUNTIME_REGISTRY.json'
      - 'RUNTIME/FACET_RUNTIME_REGISTRY.json'
  pull_request:
    paths:
      - '.github/workflows/mycel-repository-checks.yml'
      - 'INTEGRATIONS/PSYLLO_CODING/workbench/**'
      - 'UI/INTELLIGENT_UI/**'
      - 'DAEMON/**'
      - 'RUNTIME/RUNTIME_REGISTRY.json'
      - 'RUNTIME/FACET_RUNTIME_REGISTRY.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mycel-source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original MYCEL R03 unittest suite
        run: python -m unittest discover -s INTEGRATIONS/PSYLLO_CODING/workbench/tests -p 'test_mycel_bridge.py' -v
      - name: MYCEL registry and file integrity (no writes)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          index = set(subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0"))
          index.discard("")
          registry = json.loads((root / "RUNTIME/RUNTIME_REGISTRY.json").read_text(encoding="utf-8"))
          references = []
          for version in ("mycel_r01", "mycel_r02", "mycel_r03"):
              value = registry.get(version)
              assert isinstance(value, dict), "Missing MYCEL version: " + version
              def visit(item):
                  if isinstance(item, dict):
                      for child in item.values():
                          visit(child)
                  elif isinstance(item, str) and item.endswith((".py", ".md", ".json")):
                      references.append((version, item))
              visit(value)
          missing = [(version, path) for version, path in references if path not in index]
          assert not missing, "MYCEL missing tracked references: " + repr(missing)
          facets = json.loads((root / "RUNTIME/FACET_RUNTIME_REGISTRY.json").read_text(encoding="utf-8"))
          assert len(facets.get("facets", [])) == 15, "Unexpected native MYCEL facet count"
          for facet in facets["facets"]:
              assert facet.get("native_owner") == "666MAIN BRAIN MYCEL SYSTEM"
              assert facet.get("independent_authority") is False
              assert facet["source"] in index, "Missing facet source " + facet["source"]
          assert registry["mycel_r03"]["native_autoexecution"] is False
          assert registry["mycel_r03"]["foreign_autoactivation"] is False
          print("PASS MYCEL references:", len(references), "| native facets:", len(facets["facets"]))
          PY
      - name: Windows portability inventory (informational only)
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess

          paths = [p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0") if p]
          folded = {}
          for path in paths:
              folded.setdefault(path.casefold(), []).append(path)
          collisions = [group for group in folded.values() if len(group) > 1]
          long_paths = [path for path in paths if len(path) + 4 >= 260]
          print("Tracked paths:", len(paths))
          print("Windows legacy path risk:", len(long_paths))
          print("Case-insensitive collision groups:", len(collisions))
          for group in collisions:
              print("INFO collision:", " | ".join(group))
          for path in long_paths[:12]:
              print("INFO long path:", path)
          print("Informational only: foreign project files are not modified.")
          PY
